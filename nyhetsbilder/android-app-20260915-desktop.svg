      <text x="445.5" y="55" text-anchor="middle" fill="#02030a" font-family="Arial,Helvetica,sans-serif" font-size="9" font-weight="900">100</text>
      <text x="112" y="118" fill="#0e6ba2" font-family="Arial,Helvetica,sans-serif" font-size="40" font-weight="900">SEH</text>
      <text x="112" y="143" fill="#d6b15f" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="900" letter-spacing="2">SVENSK eHOCKEY</text>

