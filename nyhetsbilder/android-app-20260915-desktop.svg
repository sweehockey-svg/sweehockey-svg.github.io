      <circle cx="58" cy="53" r="31" fill="#d6b15f" fill-opacity=".09" stroke="#d6b15f" stroke-opacity=".45"/>
      <path d="M58 32v30m-11-10 11 11 11-11M45 71h26" fill="none" stroke="#ffcc00" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="106" y="41" fill="#61e5df" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="900" letter-spacing="2">SVENSK eHOCKEY APP</text>
