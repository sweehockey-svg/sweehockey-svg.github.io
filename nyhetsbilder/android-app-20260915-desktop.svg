  <text x="1520" y="842" text-anchor="end" fill="#f0d58b" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="800" letter-spacing="4">DIN eHOCKEY. DIREKT I MOBILEN.</text>
</svg>