      <circle cx="268" cy="51" r="10" fill="#010205" stroke="#1a222c" stroke-width="2"/>
      <circle cx="268" cy="51" r="3" fill="#0c2433"/>
      <text x="105" y="62" fill="#f5f3eb" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="800">22:27</text>
