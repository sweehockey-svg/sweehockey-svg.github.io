<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Svensk eHockey nu på Android</title>
  <desc id="desc">Mörk premiumgrafik i navy, guld och cyan med mobilapp och nedladdningsbudskap.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#02030a"/>
      <stop offset=".55" stop-color="#07111e"/>
      <stop offset="1" stop-color="#02030a"/>
    </linearGradient>
    <radialGradient id="cyanGlow" cx=".78" cy=".40" r=".48">
      <stop offset="0" stop-color="#0b79a8" stop-opacity=".38"/>
      <stop offset=".55" stop-color="#0b79a8" stop-opacity=".10"/>
      <stop offset="1" stop-color="#0b79a8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="goldGlow" cx=".44" cy=".74" r=".46">
      <stop offset="0" stop-color="#d6b15f" stop-opacity=".14"/>
      <stop offset="1" stop-color="#d6b15f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d6b15f"/>
      <stop offset=".48" stop-color="#f0d58b"/>
      <stop offset="1" stop-color="#ffcc00"/>
    </linearGradient>
    <linearGradient id="phone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111d2b"/>
      <stop offset="1" stop-color="#03070d"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="28" stdDeviation="34" flood-color="#000" flood-opacity=".58"/>
    </filter>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <pattern id="grid" width="54" height="54" patternUnits="userSpaceOnUse">
      <path d="M54 0H0V54" fill="none" stroke="#fff" stroke-opacity=".028" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#cyanGlow)"/>
  <rect width="1600" height="900" fill="url(#goldGlow)"/>
  <rect x="930" y="0" width="670" height="900" fill="url(#grid)"/>
  <path d="M1050 -60 1600 -60 1600 36 990 720 900 720Z" fill="#0b1726" opacity=".52"/>
  <path d="M1280 -10 1370 -10 940 900 852 900Z" fill="#d6b15f" opacity=".045"/>
  <path d="M1460 0 1510 0 1082 900 1032 900Z" fill="#61e5df" opacity=".03"/>
  <rect x="36" y="36" width="1528" height="828" rx="22" fill="none" stroke="#fff" stroke-opacity=".12"/>
  <rect x="36" y="36" width="1528" height="3" rx="2" fill="url(#gold)" opacity=".82"/>

  <g transform="translate(86 90)">
    <text x="0" y="0" fill="#61e5df" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="800" letter-spacing="3">SVENSK eHOCKEY / APP</text>
    <rect x="278" y="-7" width="90" height="2" fill="#61e5df" opacity=".6"/>
    <text x="0" y="118" fill="#f5f3eb" font-family="Arial,Helvetica,sans-serif" font-size="92" font-weight="900" letter-spacing="-5">Svensk eHockey</text>
    <text x="0" y="214" fill="url(#gold)" font-family="Arial,Helvetica,sans-serif" font-size="96" font-weight="900" letter-spacing="-5">nu på Android</text>
