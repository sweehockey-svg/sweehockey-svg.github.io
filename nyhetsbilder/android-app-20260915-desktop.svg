    <text x="300" y="426" text-anchor="middle" fill="#0b69a0" font-family="Arial,Helvetica,sans-serif" font-size="86" font-weight="900" letter-spacing="-5">SEH</text>
    <text x="300" y="466" text-anchor="middle" fill="#d6b15f" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="900" letter-spacing="3">SVENSK eHOCKEY</text>

