        <rect width="316" height="104" rx="18" fill="#0b1a2a"/>
        <text x="20" y="32" fill="#61e5df" font-size="12" font-weight="900" letter-spacing="2">SENASTE NYTT</text>
        <text x="20" y="61" fill="#f5f3eb" font-size="20" font-weight="800">Svenska eHockey-nyheter</text>
        <text x="20" y="84" fill="#8895a4" font-size="13">Direkt i mobilen</text>

        <rect y="122" width="151" height="96" rx="16" fill="#091522"/>
        <text x="18" y="157" fill="#f0d58b" font-size="13" font-weight="900">SPELARE</text>
        <text x="18" y="185" fill="#f5f3eb" font-size="24" font-weight="900">Profiler</text>

        <rect x="165" y="122" width="151" height="96" rx="16" fill="#091522"/>
        <text x="183" y="157" fill="#f0d58b" font-size="13" font-weight="900">LAG</text>
        <text x="183" y="185" fill="#f5f3eb" font-size="24" font-weight="900">Historik</text>

        <rect y="232" width="316" height="72" rx="16" fill="#07111d" stroke="#d6b15f" stroke-opacity=".22"/>
        <text x="18" y="260" fill="#7f8995" font-size="12" font-weight="800">SVENSK STATISTIK</text>
        <text x="18" y="288" fill="#f5f3eb" font-size="21" font-weight="900">Statistik &amp; ranking</text>

        <rect y="318" width="316" height="72" rx="16" fill="#07111d" stroke="#fff" stroke-opacity=".06"/>
        <text x="18" y="347" fill="#7f8995" font-size="12" font-weight="800">TÄVLINGAR</text>
        <text x="18" y="375" fill="#f5f3eb" font-size="21" font-weight="900">ECL · SEC · mer</text>
      </g>

      <rect x="112" y="596" width="312" height="46" rx="15" fill="#02070d"/>
      <text x="141" y="625" fill="#ffcc00" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="900">HEM</text>
      <text x="214" y="625" fill="#788696" font-family="Arial,Helvetica,sans-serif" font-size="13">NYHETER</text>
      <text x="318" y="625" fill="#788696" font-family="Arial,Helvetica,sans-serif" font-size="13">SPELARE</text>
