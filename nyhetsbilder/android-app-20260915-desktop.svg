        <path d="M28 59v-19m12 19V28m12 31V36" stroke="#ffcc00" stroke-width="7" stroke-linecap="round"/>
        <text x="74" y="41" fill="#f4f1e9" font-size="15" font-weight="900">STATISTIK</text>
        <text x="74" y="64" fill="#7f8995" font-size="13">Svenska spelare</text>
