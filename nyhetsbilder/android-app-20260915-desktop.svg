      <circle cx="503" cy="53" r="24" fill="#d6b15f" fill-opacity=".05" stroke="#d6b15f" stroke-opacity=".38"/>
      <path d="M493 53h20m-7-7 7 7-7 7" fill="none" stroke="#f0d58b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
