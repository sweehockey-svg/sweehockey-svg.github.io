        <circle cx="33" cy="38" r="10" fill="#d6b15f"/><circle cx="54" cy="38" r="10" fill="#d6b15f"/>
        <path d="M19 62c2-13 9-18 14-18s12 5 14 18M40 62c2-13 9-18 14-18s12 5 14 18" fill="#d6b15f" opacity=".9"/>
