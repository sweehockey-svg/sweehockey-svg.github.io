<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Svensk eHockey nu på Android – mobil nyhetsbild</title>
  <desc id="desc">Mobilanpassad nyhetsbild med stor Android-rubrik, mobilmockup och Svensk eHockey-färger.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#02030a"/>
      <stop offset=".62" stop-color="#07111e"/>
      <stop offset="1" stop-color="#02030a"/>
    </linearGradient>
    <radialGradient id="glow" cx=".82" cy=".52" r=".54">
      <stop offset="0" stop-color="#0b79a8" stop-opacity=".38"/>
      <stop offset="1" stop-color="#0b79a8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d6b15f"/>
      <stop offset=".5" stop-color="#f0d58b"/>
      <stop offset="1" stop-color="#ffcc00"/>
    </linearGradient>
    <linearGradient id="phone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101d2b"/>
      <stop offset="1" stop-color="#03070d"/>
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="22" stdDeviation="28" flood-color="#000" flood-opacity=".62"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#glow)"/>
  <path d="M892 -30H1200V45L905 675H800Z" fill="#d6b15f" opacity=".055"/>
  <path d="M1004 -20H1070L772 675H708Z" fill="#61e5df" opacity=".035"/>
  <rect x="20" y="20" width="1160" height="635" rx="18" fill="none" stroke="#fff" stroke-opacity=".11"/>
  <rect x="20" y="20" width="1160" height="3" fill="url(#gold)" opacity=".84"/>

  <g transform="translate(62 72)" font-family="Arial,Helvetica,sans-serif">
    <text x="0" y="0" fill="#61e5df" font-size="17" font-weight="900" letter-spacing="3">SVENSK eHOCKEY APP</text>
    <text x="0" y="86" fill="#f5f3eb" font-size="74" font-weight="900" letter-spacing="-4">NU PÅ</text>
    <text x="0" y="164" fill="url(#gold)" font-size="78" font-weight="900" letter-spacing="-4">ANDROID</text>
    <text x="0" y="212" fill="#c4ccd5" font-size="23" font-weight="700">All svensk eHockey. Direkt i mobilen.</text>

    <g transform="translate(0 254)">
      <rect width="424" height="90" rx="17" fill="#07121f" stroke="#d6b15f" stroke-opacity=".78"/>
      <circle cx="49" cy="45" r="27" fill="#d6b15f" fill-opacity=".08" stroke="#d6b15f" stroke-opacity=".42"/>
      <path d="M49 29v26m-9-9 9 10 9-10M38 62h22" fill="none" stroke="#ffcc00" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="91" y="37" fill="#61e5df" font-size="12" font-weight="900" letter-spacing="2">LADDA NER</text>
      <text x="91" y="64" fill="#f5f3eb" font-size="23" font-weight="900">Android-appen</text>
      <path d="M374 45h22m-8-8 8 8-8 8" fill="none" stroke="#f0d58b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <g transform="translate(0 388)">
      <text x="0" y="0" fill="#7f8995" font-size="15" font-weight="800">NYHETER · SPELARE · LAG · STATISTIK · TÄVLINGAR</text>
      <text x="0" y="35" fill="#f0d58b" font-size="15" font-weight="800" letter-spacing="2">SVENSKEHOCKEY.SE</text>
    </g>
  </g>

  <g transform="translate(704 48)" filter="url(#shadow)">
    <circle cx="250" cy="355" r="184" fill="#02050a" stroke="#0b6f9e" stroke-opacity=".34"/>
    <text x="250" y="338" text-anchor="middle" fill="#0b6aa1" font-family="Arial,Helvetica,sans-serif" font-size="70" font-weight="900">SEH</text>
    <text x="250" y="372" text-anchor="middle" fill="#d6b15f" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="900" letter-spacing="2">SVENSK eHOCKEY</text>

    <g transform="rotate(-6 220 270)">
      <rect x="52" y="15" width="332" height="558" rx="46" fill="#06090f" stroke="#8194a8" stroke-width="4"/>
      <rect x="64" y="28" width="308" height="532" rx="37" fill="url(#phone)"/>
      <rect x="158" y="38" width="122" height="21" rx="11" fill="#02030a"/>
      <text x="88" y="100" fill="#0e6ba2" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="900">SEH</text>
      <text x="88" y="121" fill="#d6b15f" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="900" letter-spacing="2">SVENSK eHOCKEY</text>

