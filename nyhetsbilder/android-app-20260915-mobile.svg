        <rect width="264" height="92" rx="15" fill="#0b1a2a"/>
        <text x="16" y="28" fill="#61e5df" font-size="10" font-weight="900" letter-spacing="2">NYHETER</text>
        <text x="16" y="55" fill="#f5f3eb" font-size="18" font-weight="900">Allt från svenska scenen</text>
        <text x="16" y="77" fill="#8592a1" font-size="11">Direkt i mobilen</text>

        <rect y="108" width="126" height="82" rx="14" fill="#091522"/>
        <text x="14" y="139" fill="#f0d58b" font-size="11" font-weight="900">SPELARE</text>
        <text x="14" y="166" fill="#f5f3eb" font-size="20" font-weight="900">Profiler</text>

        <rect x="138" y="108" width="126" height="82" rx="14" fill="#091522"/>
        <text x="152" y="139" fill="#f0d58b" font-size="11" font-weight="900">LAG</text>
        <text x="152" y="166" fill="#f5f3eb" font-size="20" font-weight="900">Historik</text>

        <rect y="205" width="264" height="61" rx="14" fill="#07111d"/>
        <text x="14" y="232" fill="#7f8995" font-size="10" font-weight="800">STATISTIK</text>
        <text x="14" y="254" fill="#f5f3eb" font-size="17" font-weight="900">Ranking &amp; resultat</text>

        <rect y="280" width="264" height="61" rx="14" fill="#07111d"/>
        <text x="14" y="307" fill="#7f8995" font-size="10" font-weight="800">TÄVLINGAR</text>
        <text x="14" y="329" fill="#f5f3eb" font-size="17" font-weight="900">ECL · SEC · mer</text>
      </g>

      <rect x="88" y="499" width="260" height="40" rx="13" fill="#02070d"/>
      <text x="108" y="524" fill="#ffcc00" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="900">HEM</text>
      <text x="169" y="524" fill="#788696" font-family="Arial,Helvetica,sans-serif" font-size="11">NYHETER</text>
      <text x="250" y="524" fill="#788696" font-family="Arial,Helvetica,sans-serif" font-size="11">SPELARE</text>
    </g>
  </g>
</svg>