name: Build optimized web images

on:
  push:
    branches: [main]
    paths:
      - "players/**"
      - "teamlogos/**"
      - "scripts/build-web-images.mjs"
      - ".github/workflows/build-web-images.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: web-image-cache
  cancel-in-progress: true

jobs:
  optimize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install image optimizer
        run: |
          test -f package.json || npm init -y >/dev/null 2>&1
          npm install --no-save --ignore-scripts=false sharp@0.34.3

      - name: Build optimized WebP copies
        run: node scripts/build-web-images.mjs

      - name: Commit optimized assets
        run: |
          if [ -z "$(git status --porcelain -- web-images)" ]; then
            echo "No image changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web-images
          git commit -m "Build optimized web image cache"
          git push
