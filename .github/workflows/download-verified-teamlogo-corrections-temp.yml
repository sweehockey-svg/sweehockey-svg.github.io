name: Temporary Verified Team Logo Corrections

on:
  push:
    paths:
      - '.github/workflows/download-verified-teamlogo-corrections-temp.yml'

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download verified images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p corrections
          python3 - <<'PY'
          import urllib.request
          from pathlib import Path
          files = {
            'Alliance HT.png': 'https://fhr.fra1.cdn.digitaloceanspaces.com/NHLGamer/ECL/ECL6/Logos/Pro/Alliance%20HT.png',
            'EXEN.png': 'https://fhr.fra1.cdn.digitaloceanspaces.com/SportsGamer/leagues/ECL21/EXEN_logo_new.png',
            'Reality Check HC.png': 'https://fhr.fra1.cdn.digitaloceanspaces.com/NHLGamer/IS_Cup_4/Logos/Reality_Check.png',
            'UNI Gaming.png': 'https://nhlgamer.com/storage/team-logos/114/464/1C3EEB08-DB56-478B-BBD0-E162EC52A3A7_20210410-095831.png',
            'Unlucky Boys.png': 'https://sportsgamer.gg/storage/team-logos/250/159/Taso%201_20221214-173956.png',
            'Chiubigigle.png': 'https://fhr.fra1.cdn.digitaloceanspaces.com/SportsGamer/leagues/ECL20/Chiubigigle_logo.png',
            'Eisbaeren Gaming.png': 'https://sportsgamer.gg/storage/team-logos/495/1893/289342948_722888538980561_2765028431077946079_n_20260122-221614.png',
            'F U R Y.png': 'https://sportsgamer.gg/storage/team-logos/449/4897/Fury2_1_20250302-223208.png',
            'French Eagles.png': 'https://sportsgamer.gg/storage/team-logos/294/2562/68981CFE-0634-44EA-9F4C-6E1BAF330F65_20230320-003749.png',
            'Thunder Kings esport.png': 'https://sportsgamer.gg/storage/team-logos/309/3825/1-2000_20230421-132748.png',
            'Exerceo.png': 'https://sportsgamer.gg/storage/team-logos/306/974/Exerceo%20logo1_20230421-114511.png',
            'Kokemus Puuttuu.png': 'https://sportsgamer.gg/storage/team-logos/481/6777/ChatGPT%20Image%208.%20syysk.%202025%20klo%2009.36.08_20251022-061335_20251030-081736.png',
            'Nurnberg Nidhoggr.png': 'https://nhlgamer.com/storage/team-logos/114/1860/nidhogger%20no%20mark_20210405-200732.png',
            'Old Schoolers.png': 'https://sportsgamer.gg/storage/team-logos/317/4069/IMG_2549_20230529-200109.png',
            'PARRU.png': 'https://fhr.fra1.cdn.digitaloceanspaces.com/NHLGamer/ECL/ECL_9/Logos/PARRU.png',
            'Pasilan SKA.png': 'https://sportsgamer.gg/storage/team-logos/481/6778/Logo2023.2_20251030-090431.png',
            'Patience.png': 'https://nhlgamer.com/storage/team-logos/120/426/patiense_20210502-113835.png',
            'Rusty X.png': 'https://sportsgamer.gg/storage/team-logos/381/252/%D0%BD%D0%BE%D0%B2%D0%BE%D0%B5%20%D0%BB%D0%BE%D0%B3%D0%BE_20240609-113924.png',
            'Stick Magnético.png': 'https://nhlgamer.com/storage/team-logos/158/766/logo2_20211117-113439.png',
          }
          opener=urllib.request.build_opener()
          opener.addheaders=[('User-Agent','Mozilla/5.0')]
          for name,url in files.items():
              print('downloading', name, flush=True)
              with opener.open(url, timeout=30) as r:
                  data=r.read()
              if len(data) < 700:
                  raise RuntimeError(f'{name}: too small {len(data)}')
              Path('corrections',name).write_bytes(data)
          PY
          ls -lh corrections
      - name: Upload corrections
        uses: actions/upload-artifact@v4
        with:
          name: verified-teamlogo-corrections
          path: corrections/
          if-no-files-found: error
          retention-days: 1
