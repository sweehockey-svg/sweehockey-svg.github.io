name: Temporary Supabase History Probe
on:
  push:
    paths:
      - '.github/workflows/probe-supabase-history-temp.yml'
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe public player directory and history RPC
        shell: bash
        run: |
          python3 - <<'PY'
          import json, urllib.parse, urllib.request, re
          base='https://oujqnvrczdavqbqaavuh.supabase.co/rest/v1'
          key='sb_publishable_-4cV-I1xCAAZrgdcGCljrQ_T7T0YC5z'
          def req(url, method='GET', body=None):
              h={'apikey':key,'Accept':'application/json'}
              data=None
              if body is not None:
                  h['Content-Type']='application/json'; data=json.dumps(body).encode()
              r=urllib.request.Request(url,headers=h,method=method,data=data)
              with urllib.request.urlopen(r,timeout=30) as x: return json.loads(x.read())
          q=urllib.parse.urlencode({'select':'player_key,display_gamertag,sports_gamer_player_url','limit':'2'})
          players=req(base+'/v_ehockey_swedish_player_directory_central_v1?'+q)
          print('PLAYERS',json.dumps(players,ensure_ascii=False))
          for p in players:
              m=re.search(r'/players/(\d+)',str(p.get('sports_gamer_player_url') or ''))
              payload={'p_player_key':p.get('player_key'),'p_sports_gamer_player_id':int(m.group(1)) if m else None,'p_display_gamertag':p.get('display_gamertag')}
              hist=req(base+'/rpc/get_ehockey_player_history_cache_v26','POST',payload)
              print('HISTORY',p.get('display_gamertag'),len(hist),json.dumps(hist[:1],ensure_ascii=False)[:1200])
          PY
