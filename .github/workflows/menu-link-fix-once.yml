name: Competition menu link fix once

on:
  push:
    paths:
      - '.github/workflows/menu-link-fix-once.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix competition menu link
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app.js')
          s = p.read_text(encoding='utf-8')
          old = '#/sasong/secl27winter'
          new = '#/sasong/ecl27winter'
          if old not in s:
              raise SystemExit('Expected typo not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')

          i = Path('index.html')
          h = i.read_text(encoding='utf-8')
          oldv = 'app.js?v=20260908-v12996-competitions-menu'
          newv = 'app.js?v=20260908-v12997-competitions-menu-link'
          if oldv not in h:
              raise SystemExit('Expected app cache version not found')
          i.write_text(h.replace(oldv, newv, 1), encoding='utf-8')
          PY
      - name: Commit link fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html
          git commit -m "Fix Tävlingar menu link"
          git push
