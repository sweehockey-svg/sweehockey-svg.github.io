name: Temporary Full Team Logo Recovery V4

on:
  push:
    paths:
      - '.github/workflows/full-teamlogo-recovery-v4-temp.yml'

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Run corrected recovery script
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src=Path('.github/workflows/full-teamlogo-recovery-v3-temp.yml').read_text(encoding='utf-8')
          start=src.index("          python3 - <<'PY'\n") + len("          python3 - <<'PY'\n")
          end=src.index("\n          PY\n", start)
          code=src[start:end]
          lines=[]
          for line in code.splitlines():
              lines.append(line[10:] if line.startswith('          ') else line)
          code='\n'.join(lines)+'\n'
          code=code.replace("req=urllib.request.Request(quote_url(url),headers=h,method=method,data=data)","req=urllib.request.Request(url,headers=h,method=method,data=data)")
          Path('/tmp/teamlogo_recovery_v4.py').write_text(code,encoding='utf-8')
          PY
          python3 /tmp/teamlogo_recovery_v4.py
          cat teamlogo-recovery-v3/summary.json
          find teamlogo-recovery-v3/teamlogos -maxdepth 1 -type f | wc -l
      - name: Upload recovered logos and audit
        uses: actions/upload-artifact@v4
        with:
          name: full-teamlogo-recovery-v4
          path: teamlogo-recovery-v3/
          if-no-files-found: error
          retention-days: 1
