name: Sync Swedish SportsGamer players
run-name: Svenska spelare · ${{ inputs.request_id || 'manual' }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Request id from the Svensk eHockey admin page
        required: false
        default: manual
        type: string

permissions:
  contents: read
  actions: write

concurrency:
  group: sync-swedish-sportsgamer-players
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install database clients
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client openssh-client
          python -m pip install --disable-pip-version-check --no-cache-dir pymysql==1.1.2

      - name: Mark sync start
        run: echo "SYNC_STARTED_AT=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"

      - name: Open SSH tunnel to SportsGamer
        env:
          SSH_HOST: ${{ secrets.SVENSK_SSH_HOST }}
          SSH_PORT: ${{ secrets.SVENSK_SSH_PORT }}
          SSH_USER: ${{ secrets.SVENSK_SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SVENSK_SSH_PRIVATE_KEY }}
          SSH_REMOTE_DB_HOST: ${{ secrets.SVENSK_SSH_REMOTE_DB_HOST }}
          SSH_REMOTE_DB_PORT: ${{ secrets.SVENSK_SSH_REMOTE_DB_PORT }}
          SSH_LOCAL_DB_PORT: ${{ secrets.SVENSK_SSH_LOCAL_DB_PORT }}
        run: |
          set -euo pipefail
          if [ -z "${SSH_HOST:-}" ]; then
            echo "No SSH host configured; using the direct database connection."
            exit 0
          fi
          : "${SSH_USER:?Missing SVENSK_SSH_USER secret}"
          : "${SSH_PRIVATE_KEY:?Missing SVENSK_SSH_PRIVATE_KEY secret}"
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/svensk_db_tunnel_key
          chmod 600 ~/.ssh/svensk_db_tunnel_key
          ssh-keyscan -p "${SSH_PORT:-22}" "$SSH_HOST" >> ~/.ssh/known_hosts
          ssh -fN \
            -i ~/.ssh/svensk_db_tunnel_key \
            -p "${SSH_PORT:-22}" \
            -L "${SSH_LOCAL_DB_PORT:-3307}:${SSH_REMOTE_DB_HOST:-127.0.0.1}:${SSH_REMOTE_DB_PORT:-3306}" \
            "$SSH_USER@$SSH_HOST"

      - name: Export Swedish profiles
        id: export
        env:
          DB_HOST: ${{ secrets.SVENSK_DB_HOST }}
          DB_PORT: ${{ secrets.SVENSK_DB_PORT }}
          DB_NAME: ${{ secrets.SVENSK_DB_NAME }}
          DB_USER: ${{ secrets.SVENSK_DB_USER }}
          DB_PASSWORD: ${{ secrets.SVENSK_DB_PASSWORD }}
          SSH_HOST: ${{ secrets.SVENSK_SSH_HOST }}
          SSH_LOCAL_DB_PORT: ${{ secrets.SVENSK_SSH_LOCAL_DB_PORT }}
          MIN_PLAYER_COUNT: '100'
        run: python .github/sync/export_swedish_players.py

      - name: Import staging data into Supabase
        env:
          PGURL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          : "${PGURL:?Missing SUPABASE_DB_URL secret}"
          psql "$PGURL" -v ON_ERROR_STOP=1 -f .github/sync/import-swedish-players.psql

      - name: Compare with current player registry
        id: changes
        env:
          PGURL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          : "${PGURL:?Missing SUPABASE_DB_URL secret}"

          new_profile_count=$(psql "$PGURL" -At -v ON_ERROR_STOP=1 -c "
            select count(*)
            from private.sportsgamer_player_master_import s
            left join public.ehockey_players p
              on p.canonical_key = 'SG:' || s.player_id::text
            where p.id is null;
          ")

          new_swedish_count=$(psql "$PGURL" -At -v ON_ERROR_STOP=1 -c "
            select count(*)
            from private.sportsgamer_player_master_import s
            join public.ehockey_players p
              on p.canonical_key = 'SG:' || s.player_id::text
            left join public.ehockey_player_nationality n
              on n.player_id = p.id
            where n.country_code is distinct from 'SE'
              and not (coalesce(n.is_locked, false) and n.country_code is distinct from 'SE');
          ")

          blocked_swedish_count=$(psql "$PGURL" -At -v ON_ERROR_STOP=1 -c "
            select count(*)
            from private.sportsgamer_player_master_import s
            join public.ehockey_players p
              on p.canonical_key = 'SG:' || s.player_id::text
            join public.ehockey_player_nationality n
              on n.player_id = p.id
            where n.is_locked = true
              and n.country_code is distinct from 'SE';
          ")

          gamertag_change_count=$(psql "$PGURL" -At -v ON_ERROR_STOP=1 -c "
            select count(*)
            from private.sportsgamer_player_master_import s
            join public.ehockey_player_identities i
              on i.identity_key = 'SPORTSGAMER:' || s.player_id::text
            where nullif(btrim(i.gamertag), '') is distinct from
                  nullif(btrim(s.display_gamertag), '');
          ")

          total_change_count=$((new_profile_count + new_swedish_count + gamertag_change_count))

          echo "new_profile_count=${new_profile_count}" >> "$GITHUB_OUTPUT"
          echo "new_swedish_count=${new_swedish_count}" >> "$GITHUB_OUTPUT"
          echo "blocked_swedish_count=${blocked_swedish_count}" >> "$GITHUB_OUTPUT"
          echo "gamertag_change_count=${gamertag_change_count}" >> "$GITHUB_OUTPUT"
          echo "total_change_count=${total_change_count}" >> "$GITHUB_OUTPUT"

          {
            echo "## Ändringar som hittades"
            echo ""
            echo "**Totalt:** ${total_change_count} ändringar"
            echo ""

            if [ "$new_profile_count" -gt 0 ]; then
              echo "### 🆕 Nya spelarprofiler (${new_profile_count})"
              echo ""
              echo "| SportsGamer ID | Gamertag |"
              echo "| ---: | --- |"
              psql "$PGURL" -At -F '|' -v ON_ERROR_STOP=1 -c "
                select
                  s.player_id,
                  replace(replace(coalesce(nullif(btrim(s.display_gamertag), ''), 'SportsGamer #' || s.player_id::text), '|', '\\|'), E'\\n', ' ')
                from private.sportsgamer_player_master_import s
                left join public.ehockey_players p
                  on p.canonical_key = 'SG:' || s.player_id::text
                where p.id is null
                order by lower(s.display_gamertag), s.player_id;
              " | while IFS='|' read -r player_id gamertag; do
                echo "| ${player_id} | ${gamertag} |"
              done
              echo ""
            fi

            if [ "$new_swedish_count" -gt 0 ]; then
              echo "### 🇸🇪 Nya svenska spelare (${new_swedish_count})"
              echo ""
              echo "Spelare som redan fanns i registret men nu är svenska enligt SportsGamer och inte har en manuell nationalitetslåsning."
              echo ""
              echo "| SportsGamer ID | Gamertag | Tidigare land |"
              echo "| ---: | --- | --- |"
              psql "$PGURL" -At -F '|' -v ON_ERROR_STOP=1 -c "
                select
                  s.player_id,
                  replace(replace(coalesce(nullif(btrim(s.display_gamertag), ''), 'SportsGamer #' || s.player_id::text), '|', '\\|'), E'\\n', ' '),
                  coalesce(n.country_code, '–')
                from private.sportsgamer_player_master_import s
                join public.ehockey_players p
                  on p.canonical_key = 'SG:' || s.player_id::text
                left join public.ehockey_player_nationality n
                  on n.player_id = p.id
                where n.country_code is distinct from 'SE'
                  and not (coalesce(n.is_locked, false) and n.country_code is distinct from 'SE')
                order by lower(s.display_gamertag), s.player_id;
              " | while IFS='|' read -r player_id gamertag old_country; do
                echo "| ${player_id} | ${gamertag} | ${old_country} |"
              done
              echo ""
            fi

            if [ "$blocked_swedish_count" -gt 0 ]; then
              echo "### 🔒 Ignorerade nationalitetsändringar (${blocked_swedish_count})"
              echo ""
              echo "SportsGamer anger dessa som svenska, men Svensk eHockey har en manuell låsning som har företräde."
              echo ""
              echo "| SportsGamer ID | Gamertag | Låst land | Orsak |"
              echo "| ---: | --- | --- | --- |"
              psql "$PGURL" -At -F '|' -v ON_ERROR_STOP=1 -c "
                select
                  s.player_id,
                  replace(replace(coalesce(nullif(btrim(s.display_gamertag), ''), 'SportsGamer #' || s.player_id::text), '|', '\\|'), E'\\n', ' '),
                  coalesce(n.country_code, '–'),
                  replace(replace(coalesce(nullif(btrim(n.reason), ''), 'Manuellt låst'), '|', '\\|'), E'\\n', ' ')
                from private.sportsgamer_player_master_import s
                join public.ehockey_players p
                  on p.canonical_key = 'SG:' || s.player_id::text
                join public.ehockey_player_nationality n
                  on n.player_id = p.id
                where n.is_locked = true
                  and n.country_code is distinct from 'SE'
                order by lower(s.display_gamertag), s.player_id;
              " | while IFS='|' read -r player_id gamertag locked_country reason; do
                echo "| ${player_id} | ${gamertag} | ${locked_country} | ${reason} |"
              done
              echo ""
            fi

            if [ "$gamertag_change_count" -gt 0 ]; then
              echo "### 🔄 Bytta gamertags (${gamertag_change_count})"
              echo ""
              echo "| SportsGamer ID | Från | Till |"
              echo "| ---: | --- | --- |"
              psql "$PGURL" -At -F '|' -v ON_ERROR_STOP=1 -c "
                select
                  s.player_id,
                  replace(replace(coalesce(nullif(btrim(i.gamertag), ''), '–'), '|', '\\|'), E'\\n', ' '),
                  replace(replace(coalesce(nullif(btrim(s.display_gamertag), ''), '–'), '|', '\\|'), E'\\n', ' ')
                from private.sportsgamer_player_master_import s
                join public.ehockey_player_identities i
                  on i.identity_key = 'SPORTSGAMER:' || s.player_id::text
                where nullif(btrim(i.gamertag), '') is distinct from
                      nullif(btrim(s.display_gamertag), '')
                order by lower(s.display_gamertag), s.player_id;
              " | while IFS='|' read -r player_id old_gt new_gt; do
                echo "| ${player_id} | ${old_gt} | ${new_gt} |"
              done
              echo ""
            fi

            if [ "$total_change_count" -eq 0 ]; then
              echo "✅ Inga nya svenska spelare eller gamertag-byten hittades."
              echo ""
            fi
          } > /tmp/swedish-player-changes.md

          cat /tmp/swedish-player-changes.md

      - name: Update the central player registry
        env:
          PGURL: ${{ secrets.SUPABASE_DB_URL }}
        run: psql "$PGURL" -v ON_ERROR_STOP=1 -f .github/sync/sync-swedish-player-registry.sql

      - name: Start Swedish player statistics sync
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST_ID: ${{ inputs.request_id || 'manual' }}
        run: |
          set -euo pipefail
          gh workflow run sync-swedish-player-stats.yml \
            --ref "${GITHUB_REF_NAME}" \
            -f request_id="after-players-${REQUEST_ID}" \
            -f dry_run=false
          echo "Started Swedish player statistics sync after the player registry update."

      - name: Write summary
        if: always()
        env:
          PROFILE_COUNT: ${{ steps.export.outputs.profile_count }}
          NEW_PROFILE_COUNT: ${{ steps.changes.outputs.new_profile_count }}
          NEW_SWEDISH_COUNT: ${{ steps.changes.outputs.new_swedish_count }}
          BLOCKED_SWEDISH_COUNT: ${{ steps.changes.outputs.blocked_swedish_count }}
          GAMERTAG_CHANGE_COUNT: ${{ steps.changes.outputs.gamertag_change_count }}
          TOTAL_CHANGE_COUNT: ${{ steps.changes.outputs.total_change_count }}
        run: |
          {
            echo "## Svenska spelare"
            echo ""
            echo "Profiler kontrollerade: **${PROFILE_COUNT:-0}**"
            echo "Ändringar hittade: **${TOTAL_CHANGE_COUNT:-0}**"
            echo ""
            echo "- Nya spelarprofiler: **${NEW_PROFILE_COUNT:-0}**"
            echo "- Befintliga spelare som nu är svenska: **${NEW_SWEDISH_COUNT:-0}**"
            echo "- Manuellt spärrade nationalitetsändringar: **${BLOCKED_SWEDISH_COUNT:-0}**"
            echo "- Gamertag-byten: **${GAMERTAG_CHANGE_COUNT:-0}**"
            echo ""
            if [ -f /tmp/swedish-player-changes.md ]; then
              cat /tmp/swedish-player-changes.md
            fi
            echo ""
            echo "Spelarstatistik: startas automatiskt efter lyckad registeruppdatering."
            echo ""
            echo "Resultat: **${{ job.status }}**"
          } >> "$GITHUB_STEP_SUMMARY"
