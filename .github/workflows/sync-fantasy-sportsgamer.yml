name: Sync eHockey Fantasy SportsGamer match data
run-name: ${{ inputs.competition_code || 'Fantasy' }} · SportsGamer · ${{ inputs.request_id || github.event_name }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Request id from Fantasy Admin
        required: false
        default: manual
        type: string
      competition_code:
        description: Fantasy competition code
        required: false
        default: 'SCL27'
        type: string
      league_ids:
        description: SportsGamer league IDs, comma separated
        required: false
        default: '447'
        type: string
      trigger_type:
        description: manual or schedule
        required: false
        default: 'manual'
        type: string
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches:
      - main
    paths:
      - '.github/sync/fantasy-sync-bootstrap.trigger'
  issues:
    types:
      - opened
permissions:
  contents: read

concurrency:
  group: sync-ehockey-fantasy-${{ inputs.competition_code || github.event_name }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PGCONNECT_TIMEOUT: 20
      PGTCP_USER_TIMEOUT: 30000
      PGKEEPALIVES: 1
      PGKEEPALIVES_IDLE: 30
      PGKEEPALIVES_INTERVAL: 10
      PGKEEPALIVES_COUNT: 3

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install database clients
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client openssh-client
          python -m pip install --disable-pip-version-check --no-cache-dir pymysql==1.1.2

      - name: Resolve request and schedule
        id: gate
        env:
          PGURL: ${{ secrets.SUPABASE_DB_URL }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_REQUEST_ID: ${{ inputs.request_id || '' }}
          INPUT_COMPETITION_CODE: ${{ inputs.competition_code || 'SCL27' }}
          INPUT_LEAGUE_IDS: ${{ inputs.league_ids || '447' }}
          INPUT_TRIGGER_TYPE: ${{ inputs.trigger_type || 'manual' }}
          ISSUE_TITLE: ${{ github.event.issue.title || '' }}
        run: |
          set -euo pipefail
          : "${PGURL:?Missing SUPABASE_DB_URL secret}"

          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "$INPUT_REQUEST_ID" ]; then
            request_id="$INPUT_REQUEST_ID"
          else
            request_id="${EVENT_NAME}-${GITHUB_RUN_ID}"
          fi

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            trigger_type="$INPUT_TRIGGER_TYPE"
            [[ "$trigger_type" =~ ^(manual|schedule)$ ]] || { echo "Invalid trigger_type"; exit 1; }
            should_run="true"
            competition_code="${INPUT_COMPETITION_CODE:-SCL27}"
            league_ids="${INPUT_LEAGUE_IDS:-447}"
          else
            trigger_type="$EVENT_NAME"
            should_run="false"
            competition_code=""
            league_ids=""

            if [ "$EVENT_NAME" = "issues" ] && [[ "$ISSUE_TITLE" != "[fantasy-sync-bootstrap]"* ]]; then
              echo "Ignoring unrelated issue event."
            else
              # Self-heal a newly created Fantasy league that has SportsGamer IDs
            # but whose player pool has not been built yet. This also covers
            # leagues created before automatic bootstrap was added.
            bootstrap_row="$(
              psql "$PGURL" -At -F '|' -v ON_ERROR_STOP=1 <<'SQL'
              select
                c.code,
                array_to_string(
                  array_remove(
                    coalesce(s.source_league_ids,'{}'::bigint[]),
                    999999::bigint
                  ),
                  ','
                )
              from public.ehockey_fantasy_competitions c
              join public.ehockey_fantasy_sync_settings s
                on s.competition_id=c.id
              where cardinality(
                      array_remove(
                        coalesce(s.source_league_ids,'{}'::bigint[]),
                        999999::bigint
                      )
                    ) > 0
                and not exists (
                  select 1
                  from public.ehockey_fantasy_player_pool p
                  where p.competition_id=c.id
                    and p.is_available
                )
              order by c.id
              limit 1;
SQL
            )"

              if [ -n "$bootstrap_row" ]; then
                competition_code="${bootstrap_row%%|*}"
                league_ids="${bootstrap_row#*|}"
                should_run="true"
              fi
            fi
          fi

          if [ "$should_run" = "true" ]; then
            [[ "$competition_code" =~ ^[A-Za-z0-9_-]{3,40}$ ]] || { echo "Invalid competition code"; exit 1; }
            [[ "$league_ids" =~ ^[0-9]+([,[:space:];]+[0-9]+)*$ ]] || { echo "Invalid league ids"; exit 1; }
            league_ids="$(echo "$league_ids" | tr '; ' ',' | sed 's/,,*/,/g; s/^,//; s/,$//')"
            primary_league_id="${league_ids%%,*}"
          else
            competition_code="NONE"
            league_ids="999999"
            primary_league_id="999999"
          fi

          echo "request_id=$request_id" >> "$GITHUB_OUTPUT"
          echo "competition_code=$competition_code" >> "$GITHUB_OUTPUT"
          echo "trigger_type=$trigger_type" >> "$GITHUB_OUTPUT"
          echo "should_run=$should_run" >> "$GITHUB_OUTPUT"
          echo "league_ids=$league_ids" >> "$GITHUB_OUTPUT"
          echo "primary_league_id=$primary_league_id" >> "$GITHUB_OUTPUT"
          echo "REQUEST_ID=$request_id" >> "$GITHUB_ENV"
          echo "COMPETITION_CODE=$competition_code" >> "$GITHUB_ENV"
          echo "TRIGGER_TYPE=$trigger_type" >> "$GITHUB_ENV"
          echo "LEAGUE_IDS=$league_ids" >> "$GITHUB_ENV"
          echo "PRIMARY_LEAGUE_ID=$primary_league_id" >> "$GITHUB_ENV"

          echo "Event: $EVENT_NAME"
          echo "Competition: $competition_code"
          echo "Trigger: $trigger_type"
          echo "Request: $request_id"
          echo "Should run: $should_run"

      - name: Mark sync start
        if: steps.gate.outputs.should_run == 'true'
        env:
          PGURL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          [[ "$REQUEST_ID" =~ ^[A-Za-z0-9_-]{8,100}$ ]] || { echo "Invalid request id"; exit 1; }
          [[ "$TRIGGER_TYPE" =~ ^(manual|schedule|push)$ ]] || { echo "Invalid trigger"; exit 1; }
          [[ "$PRIMARY_LEAGUE_ID" =~ ^[0-9]+$ ]] || { echo "Invalid primary league id"; exit 1; }
          [[ "$COMPETITION_CODE" =~ ^[A-Za-z0-9_-]{3,40}$ ]] || { echo "Invalid competition code"; exit 1; }
          psql "$PGURL" -v ON_ERROR_STOP=1 <<SQL
          insert into public.ehockey_fantasy_sync_runs(
            competition_id,request_id,trigger_type,status,source_league_id,started_at
          )
          select id, '$REQUEST_ID', '$TRIGGER_TYPE', 'running', $PRIMARY_LEAGUE_ID::bigint, now()
          from public.ehockey_fantasy_competitions
          where upper(code)=upper('$COMPETITION_CODE')
          on conflict (competition_id,request_id) where request_id is not null
          do update set
            trigger_type=excluded.trigger_type,
            status='running',
            source_league_id=excluded.source_league_id,
            details=jsonb_build_object('source_league_ids',string_to_array('$LEAGUE_IDS',',')::bigint[]),
            error_message=null,
            started_at=now(),
            finished_at=null;
          SQL

      - name: Open read-only SSH tunnel to SportsGamer
        if: steps.gate.outputs.should_run == 'true'
        env:
          SSH_HOST: ${{ secrets.SVENSK_SSH_HOST }}
          SSH_PORT: ${{ secrets.SVENSK_SSH_PORT }}
          SSH_USER: ${{ secrets.SVENSK_SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SVENSK_SSH_PRIVATE_KEY }}
          SSH_REMOTE_DB_HOST: ${{ secrets.SVENSK_SSH_REMOTE_DB_HOST }}
          SSH_REMOTE_DB_PORT: ${{ secrets.SVENSK_SSH_REMOTE_DB_PORT }}
          SSH_LOCAL_DB_PORT: ${{ secrets.SVENSK_SSH_LOCAL_DB_PORT }}
        run: |
          set -euo pipefail
          : "${SSH_HOST:?Missing SVENSK_SSH_HOST secret}"
          : "${SSH_USER:?Missing SVENSK_SSH_USER secret}"
          : "${SSH_PRIVATE_KEY:?Missing SVENSK_SSH_PRIVATE_KEY secret}"
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/svensk_db_tunnel_key
          chmod 600 ~/.ssh/svensk_db_tunnel_key
          ssh-keyscan -p "${SSH_PORT:-22}" "$SSH_HOST" >> ~/.ssh/known_hosts
          ssh -fN -i ~/.ssh/svensk_db_tunnel_key -p "${SSH_PORT:-22}"             -L "${SSH_LOCAL_DB_PORT:-3307}:${SSH_REMOTE_DB_HOST:-127.0.0.1}:${SSH_REMOTE_DB_PORT:-3306}"             "$SSH_USER@$SSH_HOST"

      - name: Read current SportsGamer roster
        if: steps.gate.outputs.should_run == 'true'
        id: roster
        env:
          DB_HOST: ${{ secrets.SVENSK_DB_HOST }}
          DB_PORT: ${{ secrets.SVENSK_DB_PORT }}
          DB_NAME: ${{ secrets.SVENSK_DB_NAME }}
          DB_USER: ${{ secrets.SVENSK_DB_USER }}
          DB_PASSWORD: ${{ secrets.SVENSK_DB_PASSWORD }}
          SSH_HOST: ${{ secrets.SVENSK_SSH_HOST }}
          SSH_LOCAL_DB_PORT: ${{ secrets.SVENSK_SSH_LOCAL_DB_PORT }}
          LEAGUE_IDS: ${{ steps.gate.outputs.league_ids }}
        run: python .github/sync/export_fantasy_sportsgamer_pool.py

      - name: Import Fantasy player pool
        if: steps.gate.outputs.should_run == 'true'
        env:
          PGURL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          timeout --foreground --kill-after=30s 12m \
            psql "$PGURL" -v ON_ERROR_STOP=1 \
              -v request_id="$REQUEST_ID" \
              -v competition_code="$COMPETITION_CODE" \
              -v league_ids="$LEAGUE_IDS" \
              -v roster_source="${{ steps.roster.outputs.roster_source }}" \
              -v player_source="${{ steps.roster.outputs.player_source }}" \
              -v team_source="${{ steps.roster.outputs.team_source }}" \
              -f .github/sync/import-fantasy-sportsgamer-pool.psql

      - name: Read match-level data from SportsGamer
        if: steps.gate.outputs.should_run == 'true'
        id: export
        env:
          DB_HOST: ${{ secrets.SVENSK_DB_HOST }}
          DB_PORT: ${{ secrets.SVENSK_DB_PORT }}
          DB_NAME: ${{ secrets.SVENSK_DB_NAME }}
          DB_USER: ${{ secrets.SVENSK_DB_USER }}
          DB_PASSWORD: ${{ secrets.SVENSK_DB_PASSWORD }}
          SSH_HOST: ${{ secrets.SVENSK_SSH_HOST }}
          SSH_LOCAL_DB_PORT: ${{ secrets.SVENSK_SSH_LOCAL_DB_PORT }}
          LEAGUE_IDS: ${{ steps.gate.outputs.league_ids }}
        run: python .github/sync/export_fantasy_sportsgamer_match_stats.py

      - name: Import match-level Fantasy data
        if: steps.gate.outputs.should_run == 'true' && steps.export.outputs.has_match_data == 'true'
        env:
          PGURL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          timeout --foreground --kill-after=30s 12m             psql "$PGURL" -v ON_ERROR_STOP=1               -v request_id="$REQUEST_ID"               -v competition_code="$COMPETITION_CODE"               -v trigger_type="$TRIGGER_TYPE"               -v league_ids="$LEAGUE_IDS"               -v source_table="${{ steps.export.outputs.skater_source }}"               -v skater_source="${{ steps.export.outputs.skater_source }}"               -v goalie_source="${{ steps.export.outputs.goalie_source }}"               -v match_source="${{ steps.export.outputs.match_source }}"               -f .github/sync/import-fantasy-sportsgamer-match-stats.psql

      - name: Mark roster-only sync success
        if: steps.gate.outputs.should_run == 'true' && steps.export.outputs.has_match_data != 'true'
        env:
          PGURL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          psql "$PGURL" -v ON_ERROR_STOP=1 <<SQL
          update public.ehockey_fantasy_sync_runs
          set status='success',
              source_table='${{ steps.roster.outputs.roster_source }}',
              matches_upserted=0,
              player_rows_upserted=0,
              match_rows_scored=0,
              details=coalesce(details,'{}'::jsonb) || jsonb_build_object(
                'source_league_ids',string_to_array('$LEAGUE_IDS',',')::bigint[],
                'pool_players_upserted',${{ steps.roster.outputs.player_count || 0 }},
                'roster_source','${{ steps.roster.outputs.roster_source }}',
                'match_data','not_started'
              ),
              finished_at=now()
          where request_id='$REQUEST_ID'
            and status in ('queued','running');

          update public.ehockey_fantasy_sync_settings
          set last_auto_sync_at=case when '$TRIGGER_TYPE'='schedule' then now() else last_auto_sync_at end,
              last_manual_sync_at=case when '$TRIGGER_TYPE'<>'schedule' then now() else last_manual_sync_at end,
              updated_at=now()
          where competition_id=(
            select id from public.ehockey_fantasy_competitions
            where upper(code)=upper('$COMPETITION_CODE')
            limit 1
          );
          SQL

      - name: Mark failed sync
        if: failure() && steps.gate.outputs.should_run == 'true'
        env:
          PGURL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set +e
          [[ "$REQUEST_ID" =~ ^[A-Za-z0-9_-]{8,100}$ ]] || exit 0
          psql "$PGURL" -v ON_ERROR_STOP=1 <<SQL
          update public.ehockey_fantasy_sync_runs
          set status='failed',
              error_message='GitHub Actions import failed. See workflow log.',
              finished_at=now()
          where request_id='$REQUEST_ID'
            and status in ('queued','running');
          SQL

      - name: Write summary
        if: always()
        run: |
          {
            echo "## eHockey Fantasy SportsGamer sync"
            echo ""
            echo "- Fantasy competition: **${{ steps.gate.outputs.competition_code }}**"
            echo "- Trigger: **${{ steps.gate.outputs.trigger_type }}**"
            echo "- Scheduled run due: **${{ steps.gate.outputs.should_run }}**"
            echo "- SportsGamer leagues: **${{ steps.gate.outputs.league_ids }}**"
            echo "- Current roster players: **${{ steps.roster.outputs.player_count || 0 }}**"
            echo "- Roster source: **${{ steps.roster.outputs.roster_source || 'n/a' }}**"
            echo "- Matches exported: **${{ steps.export.outputs.match_count || 0 }}**"
            echo "- Player-match rows: **${{ steps.export.outputs.player_row_count || 0 }}**"
            echo "- Skater source: **${{ steps.export.outputs.skater_source || '–' }}**"
            echo "- Goalie source: **${{ steps.export.outputs.goalie_source || '–' }}**"
            echo "- Match source: **${{ steps.export.outputs.match_source || 'participant fallback' }}**"
            echo ""
            echo "SportsGamer access is READ ONLY."
            echo "Result: **${{ job.status }}**"
          } >> "$GITHUB_STEP_SUMMARY"
