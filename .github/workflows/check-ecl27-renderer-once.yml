name: Check ECL27 renderer once

on:
  push:
    paths:
      - '.github/workflows/check-ecl27-renderer-once.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: node --check ecl27-team-builds-source-enrichment.js && node --check ecl27-team-builds-v2.js
