name: Sync SCL recordbook match history

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-recordbook-scl-history.yml'
      - '.github/sync/export_recordbook_scl_history.py'
      - '.github/sync/import-recordbook-scl-history.psql'

permissions:
  contents: read

concurrency:
  group: sync-scl-recordbook-history
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      LEAGUE_IDS: '47,83,148,233,310,369,447'
      PGCONNECT_TIMEOUT: 20
      PGTCP_USER_TIMEOUT: 30000
      PGKEEPALIVES: 1
      PGKEEPALIVES_IDLE: 30
      PGKEEPALIVES_INTERVAL: 10
      PGKEEPALIVES_COUNT: 3

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install clients
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client openssh-client
          python -m pip install --disable-pip-version-check --no-cache-dir pymysql==1.1.2

      - name: Open read-only SSH tunnel to SportsGamer
        env:
          SSH_HOST: ${{ secrets.SVENSK_SSH_HOST }}
          SSH_PORT: ${{ secrets.SVENSK_SSH_PORT }}
          SSH_USER: ${{ secrets.SVENSK_SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SVENSK_SSH_PRIVATE_KEY }}
          SSH_REMOTE_DB_HOST: ${{ secrets.SVENSK_SSH_REMOTE_DB_HOST }}
          SSH_REMOTE_DB_PORT: ${{ secrets.SVENSK_SSH_REMOTE_DB_PORT }}
          SSH_LOCAL_DB_PORT: ${{ secrets.SVENSK_SSH_LOCAL_DB_PORT }}
        run: |
          set -euo pipefail
          : "${SSH_HOST:?Missing SVENSK_SSH_HOST secret}"
          : "${SSH_USER:?Missing SVENSK_SSH_USER secret}"
          : "${SSH_PRIVATE_KEY:?Missing SVENSK_SSH_PRIVATE_KEY secret}"
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/svensk_db_tunnel_key
          chmod 600 ~/.ssh/svensk_db_tunnel_key
          ssh-keyscan -p "${SSH_PORT:-22}" "$SSH_HOST" >> ~/.ssh/known_hosts
          ssh -fN -i ~/.ssh/svensk_db_tunnel_key -p "${SSH_PORT:-22}" \
            -L "${SSH_LOCAL_DB_PORT:-3307}:${SSH_REMOTE_DB_HOST:-127.0.0.1}:${SSH_REMOTE_DB_PORT:-3306}" \
            "$SSH_USER@$SSH_HOST"

      - name: Export official SCL match and goal data
        env:
          DB_HOST: ${{ secrets.SVENSK_DB_HOST }}
          DB_PORT: ${{ secrets.SVENSK_DB_PORT }}
          DB_NAME: ${{ secrets.SVENSK_DB_NAME }}
          DB_USER: ${{ secrets.SVENSK_DB_USER }}
          DB_PASSWORD: ${{ secrets.SVENSK_DB_PASSWORD }}
          SSH_HOST: ${{ secrets.SVENSK_SSH_HOST }}
          SSH_LOCAL_DB_PORT: ${{ secrets.SVENSK_SSH_LOCAL_DB_PORT }}
        run: python .github/sync/export_recordbook_scl_history.py

      - name: Import SCL recordbook source
        env:
          PGURL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          : "${PGURL:?Missing SUPABASE_DB_URL secret}"
          timeout --foreground --kill-after=30s 15m \
            psql "$PGURL" -v ON_ERROR_STOP=1 \
              -f .github/sync/import-recordbook-scl-history.psql

      - name: Summary
        if: always()
        run: |
          {
            echo "## SCL recordbook history sync"
            echo ""
            echo "- SportsGamer leagues: **$LEAGUE_IDS**"
            echo "- Source access: **READ ONLY**"
            echo "- Result: **${{ job.status }}**"
          } >> "$GITHUB_STEP_SUMMARY"
