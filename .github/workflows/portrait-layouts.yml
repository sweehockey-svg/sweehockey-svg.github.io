name: Generate portrait layouts

on:
  workflow_dispatch:
  push:
    paths:
      - 'players/*.png'
      - 'scripts/generate_portrait_layouts.py'

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: pip install pillow

      - name: Generate portrait metadata
        run: python scripts/generate_portrait_layouts.py

      - name: Commit metadata when changed
        run: |
          if git diff --quiet -- players/portrait-layouts.json; then
            echo "No portrait layout changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add players/portrait-layouts.json
          git commit -m "Update portrait layout metadata"
          git push
