name: Fix ECL27 loading race once

on:
  push:
    paths:
      - '.github/workflows/fix-ecl27-loading-once.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make ECL27 renderer wait for shared source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64

          path = Path('ecl27-team-builds-v2.js')
          text = path.read_text(encoding='utf-8')
          old_start = base64.b64decode('KGZ1bmN0aW9uICgpIHsKICAidXNlIHN0cmljdCI7CgogIGNvbnN0IERBVEEgPSB3aW5kb3cuU0VIX0VDTDI3X0RBVEE7CiAgaWYgKCFEQVRBKSB7CiAgICBjb25zb2xlLmVycm9yKCJbRUNMMjddIHNvdXJjZSBtb2RlbCBtaXNzaW5nIik7CiAgICByZXR1cm47CiAgfQo=').decode('utf-8')
          new_start = base64.b64decode('').decode('utf-8')
          old_end = base64.b64decode('ICBpZiAoZG9jdW1lbnQucmVhZHlTdGF0ZSA9PT0gImxvYWRpbmciKSB7CiAgICBkb2N1bWVudC5hZGRFdmVudExpc3RlbmVyKCJET01Db250ZW50TG9hZGVkIixzY2hlZHVsZU1vdW50LHtvbmNlOnRydWV9KTsKICB9IGVsc2UgewogICAgc2NoZWR1bGVNb3VudCgpOwogIH0KfSkoKTsK').decode('utf-8')
          new_end = base64.b64decode('ICBpZiAoZG9jdW1lbnQucmVhZHlTdGF0ZSA9PT0gImxvYWRpbmciKSB7CiAgICBkb2N1bWVudC5hZGRFdmVudExpc3RlbmVyKCJET01Db250ZW50TG9hZGVkIixzY2hlZHVsZU1vdW50LHtvbmNlOnRydWV9KTsKICB9IGVsc2UgewogICAgc2NoZWR1bGVNb3VudCgpOwogIH0KICB9CgogIHN0YXJ0RWNsMjdSZW5kZXJlcigpOwp9KSgpOwo=').decode('utf-8')
          if old_start not in text or old_end not in text:
              raise SystemExit('Expected ECL27 renderer markers not found; refusing to patch')
          text = text.replace(old_start, new_start, 1).replace(old_end, new_end, 1)
          path.write_text(text, encoding='utf-8')

          index = Path('index.html')
          html = index.read_text(encoding='utf-8')
          replacements = {
            'ecl27-team-builds-source-enrichment.js?v=20260908-v5-albin-out': 'ecl27-team-builds-source-enrichment.js?v=20260909-v6-data-ready',
            'ecl27-team-builds-v2.js?v=20260908-v7-all-roster-players': 'ecl27-team-builds-v2.js?v=20260909-v8-await-source'
          }
          for old, new in replacements.items():
              if old not in html:
                  raise SystemExit(f'Expected cache version not found: {old}')
              html = html.replace(old, new, 1)
          index.write_text(html, encoding='utf-8')
          PY
      - name: Commit loading fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ecl27-team-builds-v2.js index.html
          git commit -m "Fix ECL27 async data loading"
          git push
