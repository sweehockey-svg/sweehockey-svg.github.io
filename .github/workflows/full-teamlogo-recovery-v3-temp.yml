name: Temporary Full Team Logo Recovery V3

on:
  push:
    paths:
      - '.github/workflows/full-teamlogo-recovery-v3-temp.yml'

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Recover every missing logo from Swedish-player history
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import concurrent.futures as cf
          import csv, html, json, re, shutil, threading, unicodedata
          import urllib.parse, urllib.request
          from collections import defaultdict
          from pathlib import Path

          BASE='https://oujqnvrczdavqbqaavuh.supabase.co/rest/v1'
          KEY='sb_publishable_-4cV-I1xCAAZrgdcGCljrQ_T7T0YC5z'
          OUT=Path('teamlogo-recovery-v3'); LOGOS=OUT/'teamlogos'; LOGOS.mkdir(parents=True,exist_ok=True)
          IMG_EXT={'.png','.jpg','.jpeg','.webp','.gif'}

          # Files already delivered in the two previous logo patches.
          KNOWN_PATCH=[
            'Oljefondet.png','Electric Ice SL.png','NOSTREETSPORTS.png','Herlev Eagles.png','Gotham Knights.png',
            'Kolikot Esports.png','Red Bull Munich eSports.png','noRex Gaming.png','Silver Sword Griffins.png',
            'Storhamar IL Esport.png','Otukset.png','Blitz Loimaa.png','Taisto.png','Coventry Vikings.png',
            'SC Rackelhahn eV.png','Rusty Blades.png','HC Lugano eSports.png','Supreme Hockey.png','Flying Hornets.png',
            'SG Denmark.png','Last Dance.png','Bad Habits.png','Setelit On Ice.png','NG HooPeeKoo.png',
            'NG 50 Shades of Blades.jpg','Mighty 8 Balls.jpg','eHockey Sweden.png','Team ICappeI.png'
          ]
          EXPLICIT={
            'VBO B Stars':'VBO STARS','Vasteras IK':'Västerås IK','Växjö Lakers':'Vaxjo Lakers HC',
            'Nordic Knights HC':'Nordic Knights','HC Macho':'Macho HC','Orebro Hockey':'Örebro Hockey',
            'Placeholder 3':'Black Panthers','Skellefteå AIK':'Skelleftea AIK','Djurgården Hockey':'Djurgarden Hockey',
            'Örebro Hockey Academy':'Orebro Hockey Academy','Favoritfemman':'Favorit Femman',
            'Svea Kronor (DSQ)':'Svea Kronor','Eskilstuna Snake (DNF)':'Eskilstuna Snake',
            'Northern Lights HC (DNF)':'Northern Lights HC','Company of Geeks (DNF)':'Company of Geeks',
            'United Warriors of Sweden (DNF)':'United Warriors of Sweden','UD Almeria (DSQ)':'UD Almeria'
          }
          STATUS=re.compile(r'\s*\((?:DNF|DSQ|DQ|DISQUALIFIED)\)\s*$',re.I)
          def clean(s): return re.sub(r'\s+',' ',html.unescape(str(s or '')).strip())
          def fold(s): return ''.join(c for c in unicodedata.normalize('NFKD',s) if not unicodedata.combining(c))
          def norm(s):
            s=fold(STATUS.sub('',clean(s))).casefold().replace('&','and')
            return ''.join(c for c in s if c.isalnum())
          def norm_generic(s):
            s=fold(STATUS.sub('',clean(s))).casefold(); toks=re.findall(r'[a-z0-9]+',s)
            return ''.join(t for t in toks if t not in {'hc','esport','esports'})
          def safe(s): return clean(s).replace('/','-').replace('\\','-').rstrip('. ') or 'Unknown Team'
          def quote_url(u):
            p=urllib.parse.urlsplit(html.unescape(u))
            path=urllib.parse.quote(urllib.parse.unquote(p.path),safe="/:@!$&'()*+,;=~-._")
            query=urllib.parse.quote(urllib.parse.unquote(p.query),safe='=&?/:;+,%@-._~')
            return urllib.parse.urlunsplit((p.scheme,p.netloc,path,query,p.fragment))

          def json_req(url,method='GET',body=None,timeout=35):
            h={'apikey':KEY,'Accept':'application/json'}; data=None
            if body is not None: h['Content-Type']='application/json'; data=json.dumps(body).encode()
            req=urllib.request.Request(quote_url(url),headers=h,method=method,data=data)
            with urllib.request.urlopen(req,timeout=timeout) as r: return json.loads(r.read())
          def get_bytes(url,accept='*/*',timeout=20):
            req=urllib.request.Request(quote_url(url),headers={'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36','Accept':accept,'Accept-Language':'en-US,en;q=0.9,sv;q=0.8'})
            with urllib.request.urlopen(req,timeout=timeout) as r: return r.read(),r.headers.get('Content-Type',''),r.geturl()

          def fetch_players():
            allp=[]; off=0
            while True:
              q=urllib.parse.urlencode({'select':'player_key,display_gamertag,sports_gamer_player_url','limit':'1000','offset':str(off)})
              b=json_req(BASE+'/v_ehockey_swedish_player_directory_central_v1?'+q)
              allp+=b; print('directory',len(allp),flush=True)
              if len(b)<1000: return allp
              off+=1000
          players=fetch_players()
          def one_history(p):
            m=re.search(r'/players/(\d+)',str(p.get('sports_gamer_player_url') or ''))
            payload={'p_player_key':p.get('player_key'),'p_sports_gamer_player_id':int(m.group(1)) if m else None,'p_display_gamertag':p.get('display_gamertag')}
            try: return p,json_req(BASE+'/rpc/get_ehockey_player_history_cache_v26','POST',payload,40),''
            except Exception as e: return p,[],type(e).__name__+': '+str(e)[:180]
          history=[]; rpc_errors=[]
          with cf.ThreadPoolExecutor(max_workers=24) as pool:
            for i,(p,rows,err) in enumerate(pool.map(one_history,players),1):
              if err: rpc_errors.append({'player_key':p.get('player_key'),'gamertag':p.get('display_gamertag'),'error':err})
              for r in rows:
                if not r.get('player_key'): r['player_key']=p.get('player_key')
                history.append(r)
              if i%100==0: print('rpc',i,'/',len(players),'rows',len(history),'errors',len(rpc_errors),flush=True)
          (OUT/'rpc-errors.json').write_text(json.dumps(rpc_errors,ensure_ascii=False,indent=2),encoding='utf-8')

          by=defaultdict(list); psets=defaultdict(set); aliases=defaultdict(set)
          for r in history:
            team=clean(r.get('team_current_name') or r.get('team_name_in_tournament'))
            if not team: continue
            by[team].append(r); psets[team].add(str(r.get('player_key') or ''))
            a=clean(r.get('team_name_in_tournament'))
            if a: aliases[team].add(a)
          for t in by:
            by[t].sort(key=lambda r:(str(r.get('chronology_date') or r.get('sort_date') or ''),int(r.get('league_id') or 0) if str(r.get('league_id') or '').isdigit() else 0),reverse=True)
          print('unique teams',len(by),flush=True)

          repo=[p for p in Path('teamlogos').iterdir() if p.is_file() and p.suffix.lower() in IMG_EXT] if Path('teamlogos').exists() else []
          rn=defaultdict(list); rg=defaultdict(list); kn=defaultdict(list); kg=defaultdict(list)
          for p in repo: rn[norm(p.stem)].append(p); rg[norm_generic(p.stem)].append(p)
          for f in KNOWN_PATCH: kn[norm(Path(f).stem)].append(f); kg[norm_generic(Path(f).stem)].append(f)
          def existing(team):
            names=[team,*sorted(aliases[team])]
            if team in EXPLICIT: names.append(EXPLICIT[team])
            for n in names:
              k=norm(n)
              if rn.get(k): return 'REPO_ALIAS',rn[k][0]
              if kn.get(k): return 'PATCH_ALIAS',kn[k][0]
            for n in names:
              k=norm_generic(n)
              if k and len(rg.get(k,[]))==1: return 'REPO_ALIAS',rg[k][0]
              if k and len(kg.get(k,[]))==1: return 'PATCH_ALIAS',kg[k][0]
            return None
          def numeric(v): return str(v or '').strip().isdigit()
          def candidate_rows(team):
            out=[]; seen=set()
            for r in by[team]:
              if not numeric(r.get('league_id')) or not numeric(r.get('team_external_id')): continue
              k=(str(r['league_id']),str(r['team_external_id']))
              if k in seen: continue
              seen.add(k); out.append(r)
              if len(out)>=12: break
            return out

          page_cache={}; lock=threading.Lock()
          def page(url):
            q=quote_url(url)
            with lock:
              if q in page_cache: return page_cache[q]
            try: v=(*get_bytes(q,'text/html,application/xhtml+xml',18),'')
            except Exception as e: v=(b'','',q,type(e).__name__+': '+str(e)[:140])
            with lock: page_cache[q]=v
            return v
          def ext_of(d,ct,u):
            if d.startswith(b'\x89PNG\r\n\x1a\n'): return '.png'
            if d.startswith(b'\xff\xd8\xff'): return '.jpg'
            if d.startswith(b'RIFF') and d[8:12]==b'WEBP': return '.webp'
            if d.startswith((b'GIF87a',b'GIF89a')): return '.gif'
            return ''
          def valid_logo(d,ext,url):
            low=urllib.parse.unquote(url).casefold()
            return len(d)>=700 and bool(ext) and not any(x in low for x in ('no-logo','nologo','placeholder','default-logo'))
          def extract_urls(data,final,lid,tid,names):
            txt=data.decode('utf-8','ignore'); found=[]; seen=set()
            raw=re.findall(r'''(?:src|href|content)\s*=\s*["']([^"']+)["']''',txt,re.I)
            # Also catch escaped JSON strings in newer pages.
            raw += [u.replace('\\/','/') for u in re.findall(r'''https?:\\?/\\?/[^"'<> ]+?\.(?:png|jpe?g|webp|gif)(?:\?[^"'<> ]*)?''',txt,re.I)]
            for u in raw:
              full=urllib.parse.urljoin(final,html.unescape(u).replace('\\/','/')); low=urllib.parse.unquote(full).casefold()
              if full in seen or not re.search(r'\.(?:png|jpe?g|webp|gif)(?:\?|$)',low): continue
              seen.add(full); score=0
              if f'/storage/team-logos/{lid}/{tid}/'.casefold() in low: score+=1800
              elif '/storage/team-logos/' in low: score+=1000
              if any(x in low for x in ('team-logo','team_logo','teamlogos','team_logos')): score+=700
              if '/logos/' in low or '/logo/' in low or '/sc' in low: score+=450
              for n in names:
                nk=norm(n)
                if len(nk)>=5 and nk[:min(10,len(nk))] in norm(urllib.parse.unquote(full)): score+=140
              if any(x in low for x in ('no-logo','nologo','placeholder','avatar','profile-picture','favicon','social-preview','banner','sponsor')): score-=3000
              if score>=400: found.append((score,full))
            return [u for _,u in sorted(found,reverse=True)]

          def slug_variants(team,names):
            vals=set()
            for raw in [team,*names]:
              s=STATUS.sub('',clean(raw)).strip()
              bases={s}
              if s.upper().startswith('NG '): bases.add(s[3:].strip())
              if s.upper().startswith('SG '): bases.add(s[3:].strip())
              for b in list(bases):
                vals.add(b); vals.add(fold(b)); vals.add(b.upper()); vals.add(b.lower())
            out=set()
            for v in vals:
              for repl in ('_','-','%20'):
                x=re.sub(r'\s+',repl,v.strip())
                out.add(x); out.add(re.sub(r'[^A-Za-z0-9_\-%]+','',x))
              out.add(re.sub(r'[^A-Za-z0-9]+','_',v).strip('_'))
            # Very old Summer Cup folders often preserved NG_ prefix.
            extra=set()
            for x in out:
              if not x.casefold().startswith('ng_') and not x.casefold().startswith('ng-'): extra.add('NG_'+x)
            return [x for x in (out|extra) if x and len(x)<100]

          def legacy_urls(team,names):
            roots=[
              'https://fhr.fra1.cdn.digitaloceanspaces.com/NHLGamer/SC1/Logos/',
              'https://fhr.fra1.cdn.digitaloceanspaces.com/NHLGamer/SC2/Logos/',
              'https://fhr.fra1.cdn.digitaloceanspaces.com/NHLGamer/SC3/Logos/',
              'https://fhr.fra1.cdn.digitaloceanspaces.com/NHLGamer/SC4/logos/',
              'https://fhr.fra1.cdn.digitaloceanspaces.com/NHLGamer/images/sc_logos/',
              'https://fhr.fra1.cdn.digitaloceanspaces.com/NHLGamer/ECL/Summer_Cup/',
            ]
            # Prefer likely spellings and cap work to avoid thousands of requests per team.
            slugs=slug_variants(team,names)
            slugs=sorted(slugs,key=lambda s:(0 if '_' in s else 1,len(s),s.casefold()))[:18]
            for root in roots:
              for slug in slugs:
                for ext in ('.png','.jpg','.jpeg'):
                  yield root+slug+ext

          def try_image(url):
            try: d,ct,fu=get_bytes(url,'image/*,*/*;q=0.8',12)
            except Exception: return None
            ext=ext_of(d,ct,fu)
            if valid_logo(d,ext,fu): return d,ext,fu
            return None

          def audit(team):
            nplayers=len([x for x in psets[team] if x]); als=sorted(aliases[team]); ex=existing(team)
            if ex:
              kind,src=ex; copied=''; srcname=src.name if isinstance(src,Path) else str(src)
              if kind=='REPO_ALIAS':
                target=LOGOS/(safe(team)+src.suffix.lower())
                if target.name.casefold()!=src.name.casefold(): shutil.copy2(src,target); copied=target.name
              return dict(team=team,status=kind,swedish_players=nplayers,source=srcname,league_id='',team_external_id='',source_url='',output_file=copied,aliases=' | '.join(als),note='existing logo/alias')
            rows=candidate_rows(team); names=[team,*als]; saw=False; nologo=False; errs=[]
            for r in rows:
              lid=str(r['league_id']); tid=str(r['team_external_id'])
              for pu in (f'https://sportsgamer.gg/leagues/{lid}/teams/{tid}',f'https://sportsgamer.gg/index.php/leagues/{lid}/teams/{tid}',f'https://nhlgamer.com/leagues/{lid}/teams/{tid}',f'https://nhlgamer.com/index.php/leagues/{lid}/teams/{tid}'):
                d,ct,fin,err=page(pu)
                if err: errs.append(err); continue
                saw=True; txt=d.decode('utf-8','ignore').casefold()
                if 'no-logo' in txt or 'no logo' in txt: nologo=True
                for iu in extract_urls(d,fin,lid,tid,names)[:10]:
                  got=try_image(iu)
                  if not got: continue
                  img,ext,fu=got; target=LOGOS/(safe(team)+ext); target.write_bytes(img)
                  return dict(team=team,status='FOUND_PAGE',swedish_players=nplayers,source=clean(r.get('team_name_in_tournament')),league_id=lid,team_external_id=tid,source_url=fu,output_file=target.name,aliases=' | '.join(als),note='latest SportsGamer tournament page with usable image')
            # Old Summer Cup/NHLGamer assets often aren't linked cleanly from the modern page.
            for iu in legacy_urls(team,names):
              got=try_image(iu)
              if not got: continue
              img,ext,fu=got; target=LOGOS/(safe(team)+ext); target.write_bytes(img)
              return dict(team=team,status='FOUND_LEGACY',swedish_players=nplayers,source='',league_id='',team_external_id='',source_url=fu,output_file=target.name,aliases=' | '.join(als),note='legacy NHLGamer/Summer Cup logo folder')
            if not rows: st='NO_SPORTSGAMER_ROW'
            elif saw and nologo: st='NO_LOGO'
            elif saw: st='PAGE_NO_IMAGE'
            else: st='PAGE_FAILED'
            return dict(team=team,status=st,swedish_players=nplayers,source='',league_id='',team_external_id='',source_url='',output_file='',aliases=' | '.join(als),note='; '.join(errs[-3:])[:500])

          teams=sorted(by,key=lambda t:(-len(psets[t]),t.casefold())); results=[]
          with cf.ThreadPoolExecutor(max_workers=10) as pool:
            futs={pool.submit(audit,t):t for t in teams}
            for i,f in enumerate(cf.as_completed(futs),1):
              try:r=f.result()
              except Exception as e:r=dict(team=futs[f],status='ERROR',swedish_players=len(psets[futs[f]]),source='',league_id='',team_external_id='',source_url='',output_file='',aliases='',note=repr(e))
              results.append(r)
              if i%20==0 or r['status'].startswith('FOUND') or r['status']=='ERROR': print(i,'/',len(teams),r['status'],r['team'],flush=True)
          results.sort(key=lambda r:(-int(r['swedish_players']),r['team'].casefold()))
          fields=['team','status','swedish_players','aliases','source','league_id','team_external_id','source_url','output_file','note']
          with (OUT/'audit.csv').open('w',newline='',encoding='utf-8-sig') as f: w=csv.DictWriter(f,fieldnames=fields); w.writeheader(); w.writerows(results)
          (OUT/'audit.json').write_text(json.dumps(results,ensure_ascii=False,indent=2),encoding='utf-8')
          counts=defaultdict(int)
          for r in results: counts[r['status']]+=1
          (OUT/'summary.json').write_text(json.dumps(dict(sorted(counts.items())),indent=2),encoding='utf-8')
          print('SUMMARY',dict(counts),'downloaded/copied',len(list(LOGOS.iterdir())),flush=True)
          PY
          cat teamlogo-recovery-v3/summary.json
          find teamlogo-recovery-v3/teamlogos -maxdepth 1 -type f | wc -l
      - name: Upload recovered logos and audit
        uses: actions/upload-artifact@v4
        with:
          name: full-teamlogo-recovery-v3
          path: teamlogo-recovery-v3/
          if-no-files-found: error
          retention-days: 1
