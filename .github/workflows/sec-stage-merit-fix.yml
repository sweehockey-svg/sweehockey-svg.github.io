name: Apply SEC stage merit fix
on:
  push:
    paths:
      - .github/workflows/sec-stage-merit-fix.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch SEC merit logic
        run: |
          echo '' | base64 -d > /tmp/sec_patch.py
          python /tmp/sec_patch.py
      - name: Remove temporary workflow
        run: rm .github/workflows/sec-stage-merit-fix.yml
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add SEC/app-modern.js .github/workflows/sec-stage-merit-fix.yml
          git commit -m 'Fix SEC personal merits by stage'
          git push origin main
