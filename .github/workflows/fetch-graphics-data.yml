name: Fetch temporary graphics data
run-name: Graphics fetch · ${{ inputs.request_id || format('smoke-{0}', github.sha) }}
on:
  workflow_dispatch:
    inputs:
      request_id:
        required: true
        type: string
      league_id:
        required: true
        type: string
      start:
        required: true
        type: string
      end:
        required: true
        type: string
  push:
    branches: [main]
    paths:
      - '.github/workflows/fetch-graphics-data.yml'
      - '.github/sync/build_transient_graphics.py'
permissions:
  contents: read
concurrency:
  group: graphics-fetch-${{ inputs.league_id || '532' }}
  cancel-in-progress: false
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DB_HOST: ${{ secrets.SVENSK_DB_HOST }}
      DB_PORT: ${{ secrets.SVENSK_DB_PORT }}
      DB_NAME: ${{ secrets.SVENSK_DB_NAME }}
      DB_USER: ${{ secrets.SVENSK_DB_USER }}
      DB_PASSWORD: ${{ secrets.SVENSK_DB_PASSWORD }}
      SSH_HOST: ${{ secrets.SVENSK_SSH_HOST }}
      SSH_LOCAL_DB_PORT: ${{ secrets.SVENSK_SSH_LOCAL_DB_PORT }}
      LEAGUE_ID: ${{ inputs.league_id || '532' }}
      LEAGUE_IDS: ${{ inputs.league_id || '532' }}
      PERIOD_START: ${{ inputs.start }}
      PERIOD_END: ${{ inputs.end }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate bounded request
        run: |
          python - <<'PY'
          import os,sys
          sys.path.insert(0,'.github/sync')
          from build_transient_graphics import ALLOWED,period
          if int(os.environ['LEAGUE_ID']) not in ALLOWED:raise ValueError('Unsupported league')
          if os.environ.get('PERIOD_START') or os.environ.get('PERIOD_END'):period(os.environ['PERIOD_START'],os.environ['PERIOD_END'])
          PY
      - name: Install read-only source client
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-client
          python -m pip install --disable-pip-version-check --no-cache-dir pymysql==1.1.2
      - name: Open read-only SSH tunnel to SportsGamer
        env:
          SSH_HOST: ${{ secrets.SVENSK_SSH_HOST }}
          SSH_PORT: ${{ secrets.SVENSK_SSH_PORT }}
          SSH_USER: ${{ secrets.SVENSK_SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SVENSK_SSH_PRIVATE_KEY }}
          SSH_REMOTE_DB_HOST: ${{ secrets.SVENSK_SSH_REMOTE_DB_HOST }}
          SSH_REMOTE_DB_PORT: ${{ secrets.SVENSK_SSH_REMOTE_DB_PORT }}
          SSH_LOCAL_DB_PORT: ${{ secrets.SVENSK_SSH_LOCAL_DB_PORT }}
        run: |
          set -euo pipefail
          : "${SSH_HOST:?Missing SVENSK_SSH_HOST secret}"
          : "${SSH_USER:?Missing SVENSK_SSH_USER secret}"
          : "${SSH_PRIVATE_KEY:?Missing SVENSK_SSH_PRIVATE_KEY secret}"
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/svensk_db_tunnel_key
          chmod 600 ~/.ssh/svensk_db_tunnel_key
          ssh-keyscan -p "${SSH_PORT:-22}" "$SSH_HOST" >> ~/.ssh/known_hosts
          ssh -fN -i ~/.ssh/svensk_db_tunnel_key -p "${SSH_PORT:-22}" \
            -L "${SSH_LOCAL_DB_PORT:-3307}:${SSH_REMOTE_DB_HOST:-127.0.0.1}:${SSH_REMOTE_DB_PORT:-3306}" \
            "$SSH_USER@$SSH_HOST"


      - name: Read teams and roster
        run: python .github/sync/export-broadcast-league-roster.py
      - name: Read standings
        run: python .github/sync/export-broadcast-league-team-stats.py
      - name: Read player statistics
        env:
          PLAYER_IDS_FILE: /tmp/broadcast_player_ids.csv
          EXPORT_FILE: /tmp/swedish_player_stats.csv
          MIN_PLAYER_COUNT: '1'
        run: python .github/sync/export_current_swedish_player_stats.py
      - name: Read match statistics
        run: python .github/sync/export_fantasy_sportsgamer_match_stats.py
      - name: Build sanitized temporary result
        run: python .github/sync/build_transient_graphics.py
      - name: Keep result temporarily, never import it into Supabase
        uses: actions/upload-artifact@v4
        with:
          name: graphics-${{ inputs.request_id || format('smoke-{0}', github.sha) }}
          path: /tmp/graphics-result/result.json
          retention-days: 1
          if-no-files-found: error
