name: Temporary Team Logo Fetch

on:
  push:
    paths:
      - '.github/workflows/fetch-teamlogos-temp.yml'

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download SportsGamer team logos
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p teamlogos
          fetch() {
            local url="$1"
            local out="$2"
            echo "Fetching $out"
            curl --fail --location --retry 3 --retry-delay 2 \
              -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36' \
              "$url" -o "teamlogos/$out"
            test -s "teamlogos/$out"
            file "teamlogos/$out"
          }

          fetch 'https://sportsgamer.gg/storage/team-logos/441/5883/IMG_2137_20250111-131202_20250111-200053.png' 'Oljefondet.png'
          fetch 'https://fhr.fra1.cdn.digitaloceanspaces.com/NHLGamer/SL/Logos/S1/Electric%20Ice%20500x500.png' 'Electric Ice SL.png'
          fetch 'https://sportsgamer.gg/storage/team-logos/481/6783/IMG_0629_20251111-135928.png' 'NOSTREETSPORTS.png'
          fetch 'https://fhr.fra1.cdn.digitaloceanspaces.com/NHLGamer/ECL/ECL10/Logos/Pro/Herlev_Eagles_500x500.png' 'Herlev Eagles.png'
          fetch 'https://sportsgamer.gg/storage/team-logos/327/10/IMG_20231004_144655_20231028-065438.png' 'Gotham Knights.png'
          fetch 'https://sportsgamer.gg/storage/team-logos/400/3826/IMG-20240125-WA0020_20241017-133114.png' 'Kolikot Esports.png'
          fetch 'https://sportsgamer.gg/storage/team-logos/327/4167/Sportsgamer%20Logo_20231019-102616.png' 'Red Bull Munich eSports.png'
          fetch 'https://nhlgamer.com/storage/team-logos/157/456/noRex%20Logo%20%28freigestellt%29_20211109-223703.png' 'noRex Gaming.png'
          fetch 'https://fhr.fra1.cdn.digitaloceanspaces.com/NHLGamer/ECL/ECL_8/team_logos/Pro/ECL8%20Pro%20-%20Silver%20Sword%20Griffins.png' 'Silver Sword Griffins.png'
          fetch 'https://fhr.fra1.cdn.digitaloceanspaces.com/NHLGamer/ECL/ECL10/Logos/Lite/Storhamar.png' 'Storhamar IL Esport.png'
          fetch 'https://sportsgamer.gg/storage/team-logos/380/582/OTUKSET_20230316-215750_20240303-092212_20240414-085921.png' 'Otukset.png'
          fetch 'https://sportsgamer.gg/storage/team-logos/181/2549/BLITZeipohjaa_20220315-234527.png' 'Blitz Loimaa.png'
          fetch 'https://sportsgamer.gg/storage/team-logos/402/2755/Image%2030.10.2024%20at%2011.24_LE_auto_custom_no_background_20241030-095231.png' 'Taisto.png'
          fetch 'https://sportsgamer.gg/storage/team-logos/327/4232/BackgroundEraser_20231019_211921497_20231019-201957.png' 'Coventry Vikings.png'
          fetch 'https://sportsgamer.gg/storage/team-logos/181/2879/rackelgr%C3%BCn_20220401-225832.png' 'SC Rackelhahn eV.png'
          fetch 'https://nhlgamer.com/storage/team-logos/119/150/Rustylogo2021-1_20210520-183454.png' 'Rusty Blades.png'
          fetch 'https://sportsgamer.gg/storage/team-logos/241/246/HCL_eSports_Logo_Black-_20221116-201839.png' 'HC Lugano eSports.png'
          fetch 'https://nhlgamer.com/storage/team-logos/114/1871/cpssd_20210406-202405.png' 'Supreme Hockey.png'
          fetch 'https://nhlgamer.com/storage/team-logos/114/1819/1Hornetz_20210330-225749.png' 'Flying Hornets.png'
          fetch 'https://fhr.fra1.cdn.digitaloceanspaces.com/SportsGamer/tournaments/SG_World_Cup/2025/flags/dk.png' 'SG Denmark.png'
          fetch 'https://sportsgamer.gg/storage/team-logos/461/336/ChatGPT%20Image%20May%206%2C%202025%2C%2002_20_45%20PM_20250506-112122.png' 'Last Dance.png'

          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          for p in sorted(Path('teamlogos').glob('*.png')):
              with Image.open(p) as im:
                  im.verify()
              print('OK', p.name)
          PY

      - name: Upload logos artifact
        uses: actions/upload-artifact@v4
        with:
          name: teamlogos-sportsgamer
          path: teamlogos/
          if-no-files-found: error
          retention-days: 1
