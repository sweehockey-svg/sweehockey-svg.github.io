name: ECL27 player card fallback once

on:
  push:
    paths:
      - '.github/workflows/ecl27-player-card-fallback-once.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch ECL 27 player card lookup
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('ecl27-team-builds-v2.js')
          text = path.read_text(encoding='utf-8')
          old = '''  async function fetchDirectoryRows(names) {
    const client = getDirectoryClient();
    if (!client || !names.length) return [];

    const select = "player_key,display_gamertag,player_image,sports_gamer_player_url,primary_position,latest_season,latest_team,career_games,total_points,player_type,tournament_count,total_goalie_saves";
    const {data,error} = await client.from("app_player_directory_cache").select(select).in("display_gamertag",names);
    if (error) throw error;

    const rows = Array.isArray(data) ? [...data] : [];
    const found = new Set(rows.map((row) => norm(row.display_gamertag)));
    const missing = names.filter((name) => !found.has(norm(name)));

    if (missing.length) {
      const extras = await Promise.all(missing.map(async (name) => {
        const result = await client.from("app_player_directory_cache").select(select).ilike("display_gamertag",name).limit(8);
        if (result.error) return null;
        return (result.data || []).find((row) => norm(row.display_gamertag) === norm(name)) || null;
      }));
      for (const row of extras) if (row) rows.push(row);
    }

    return rows;
  }
'''
          new = '''  async function fetchDirectoryRows(names) {
    const client = getDirectoryClient();
    if (!client || !names.length) return [];

    const select = "player_key,display_gamertag,player_image,sports_gamer_player_url,primary_position,latest_season,latest_team,career_games,total_points,player_type,tournament_count,total_goalie_saves";
    const {data,error} = await client.from("app_player_directory_cache").select(select).in("display_gamertag",names);
    if (error) throw error;

    const rows = Array.isArray(data) ? [...data] : [];
    const found = new Set(rows.map((row) => norm(row.display_gamertag)));
    const missing = names.filter((name) => !found.has(norm(name)));

    // app_player_directory_cache is intentionally the Swedish player directory.
    // A Swedish ECL team can still contain foreign players, so roster cards must
    // fall back to the all-player Supabase summary instead of showing empty data.
    if (missing.length) {
      const {data:fallback,error:fallbackError} = await client.rpc(
        "seh_ecl27_player_card_rows",
        {p_names:missing}
      );
      if (fallbackError) {
        console.warn("[ECL27] kunde inte hämta fallback-data för utländska/ej katalogförda spelare",fallbackError);
      } else {
        for (const row of fallback || []) {
          if (row && !found.has(norm(row.display_gamertag))) {
            rows.push(row);
            found.add(norm(row.display_gamertag));
          }
        }
      }
    }

    return rows;
  }
'''
          if old in text:
              text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
          elif 'seh_ecl27_player_card_rows' not in text:
              raise SystemExit('Expected fetchDirectoryRows block not found; refusing to patch')

          index = Path('index.html')
          html = index.read_text(encoding='utf-8')
          html = html.replace(
              'ecl27-team-builds-v2.js?v=20260908-v6-player-roster-cards',
              'ecl27-team-builds-v2.js?v=20260908-v7-all-roster-players'
          )
          index.write_text(html, encoding='utf-8')
          PY
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ecl27-team-builds-v2.js index.html
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Fix ECL27 roster cards for non-Swedish players"
          git push
