name: ECL27 player card fallback once

on:
  push:
    paths:
      - '.github/workflows/ecl27-player-card-fallback-once.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch ECL 27 player card lookup
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          old = base64.b64decode('').decode('utf-8')
          new = base64.b64decode('').decode('utf-8')
          path = Path('ecl27-team-builds-v2.js')
          text = path.read_text(encoding='utf-8')
          if old in text:
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
          elif 'seh_ecl27_player_card_rows' not in text:
              raise SystemExit('Expected fetchDirectoryRows block not found; refusing to patch')
          index = Path('index.html')
          html = index.read_text(encoding='utf-8')
          html = html.replace('ecl27-team-builds-v2.js?v=20260908-v6-player-roster-cards','ecl27-team-builds-v2.js?v=20260908-v7-all-roster-players')
          index.write_text(html, encoding='utf-8')
          PY
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ecl27-team-builds-v2.js index.html
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Fix ECL27 roster cards for non-Swedish players"
          git push
