name: Build improved player admin workspace

on:
  push:
    paths:
      - '.github/workflows/admin-player-workspace-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch app
        run: python .github/admin_player_patch.py
      - name: Validate JavaScript
        run: node --check app.js
      - name: Remove temporary patch files
        run: rm .github/workflows/admin-player-workspace-v2.yml .github/admin_player_patch.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html admin-player-workspace-v2.css .github/workflows/admin-player-workspace-v2.yml .github/admin_player_patch.py
          git commit -m "Redesign player admin workspace with partial profile review"
          git push origin main
