name: Debug ECL27 live once

on:
  push:
    paths:
      - '.github/workflows/debug-ecl27-live-once.yml'

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: npm install --no-save playwright@1.55.0 && npx playwright install --with-deps chromium
      - name: Inspect live ECL27 page
        shell: bash
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          (async()=>{
            const browser = await chromium.launch({headless:true});
            const page = await browser.newPage();
            page.on('console', msg => console.log('BROWSER-CONSOLE', msg.type(), msg.text()));
            page.on('pageerror', err => console.log('PAGE-ERROR', err.stack || err.message));
            page.on('requestfailed', req => console.log('REQUEST-FAILED', req.url(), req.failure()?.errorText));
            const response = await page.goto('https://www.svenskehockey.se/#/sasong/ecl27winter', {waitUntil:'domcontentloaded', timeout:60000});
            console.log('HTTP', response && response.status());
            await page.waitForTimeout(10000);
            const state = await page.evaluate(() => ({
              href: location.href,
              hash: location.hash,
              overview: !!document.querySelector('#overview'),
              eclSection: !!document.querySelector('#ecl27TeamBuildsV2'),
              eclText: document.querySelector('#ecl27TeamBuildsV2')?.innerText?.slice(0,1200) || '',
              dataBuild: window.SEH_ECL27_DATA?.build || null,
              springTeams: window.SEH_ECL27_DATA?.springTeams?.length ?? null,
              newTeams: window.SEH_ECL27_DATA?.newTeams?.length ?? null,
              moveEvents: window.SEH_ECL27_DATA?.moveEvents?.length ?? null,
              readyPromise: !!window.SEH_ECL27_DATA_READY,
              bodyText: document.body.innerText.slice(-1800)
            }));
            console.log('STATE', JSON.stringify(state, null, 2));
            await browser.close();
          })().catch(err=>{ console.error(err); process.exit(1); });
          NODE
