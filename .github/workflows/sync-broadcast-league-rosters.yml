# Includes WV 4 Nations 2026 (532) for Graphics Studio.
name: Sync Broadcast Studio league data
run-name: Broadcast data · ${{ inputs.request_id || github.event_name }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Request id from Broadcast Studio
        required: false
        default: manual
        type: string
      league_ids:
        description: SportsGamer league IDs, comma-separated
        required: false
        default: '523,524,525,526,527,529,532'
        type: string
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-broadcast-league-rosters.yml'
      - '.github/sync/export-broadcast-league-roster.py'
      - '.github/sync/export-broadcast-league-team-stats.py'
      - '.github/sync/import-broadcast-league-roster.psql'
      - '.github/sync/import-broadcast-league-team-stats.psql'
      - '.github/workflows/sync-fantasy-sportsgamer.yml'
      - '.github/workflows/sync-scl27-official-teams.yml'
      - '.github/sync/prepare-scl-stat-player-ids.py'

permissions:
  contents: read

concurrency:
  group: sync-broadcast-league-rosters
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      has_other_leagues: ${{ steps.matrix.outputs.has_other_leagues }}
      include_scl: ${{ steps.matrix.outputs.include_scl }}
    steps:
      - id: matrix
        env:
          REQUESTED: ${{ inputs.league_ids || (github.event_name == 'push' && '527,532') || '523,524,525,526,527,529,532' }}
        run: |
          python - <<'PY'
          import json, os
          allowed={523,524,525,526,527,529,532}
          raw=os.environ.get("REQUESTED","")
          ids=[]
          for part in raw.replace(";",",").replace(" ",",").split(","):
              if not part:
                  continue
              value=int(part)
              if value not in allowed:
                  raise SystemExit(f"Unsupported league id: {value}")
              if value not in ids:
                  ids.append(value)
          if not ids:
              raise SystemExit("No league ids selected")
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as fh:
              other=[value for value in ids if value != 527]
              fh.write("matrix="+json.dumps(other or [523],separators=(",",":"))+"\n")
              fh.write("has_other_leagues="+str(bool(other)).lower()+"\n")
              fh.write("include_scl="+str(527 in ids).lower()+"\n")
          PY

  scl:
    needs: prepare
    if: needs.prepare.outputs.include_scl == 'true'
    uses: ./.github/workflows/sync-fantasy-sportsgamer.yml
    with:
      request_id: ${{ inputs.request_id || '' }}
      competition_code: SCL2027
      league_ids: '527'
      trigger_type: manual
    secrets: inherit

  sync:
    needs: prepare
    if: needs.prepare.outputs.has_other_leagues == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        league_id: ${{ fromJson(needs.prepare.outputs.matrix) }}

    env:
      PGCONNECT_TIMEOUT: 20
      PGTCP_USER_TIMEOUT: 30000
      PGKEEPALIVES: 1
      PGKEEPALIVES_IDLE: 30
      PGKEEPALIVES_INTERVAL: 10
      PGKEEPALIVES_COUNT: 3
      DB_HOST: ${{ secrets.SVENSK_DB_HOST }}
      DB_PORT: ${{ secrets.SVENSK_DB_PORT }}
      DB_NAME: ${{ secrets.SVENSK_DB_NAME }}
      DB_USER: ${{ secrets.SVENSK_DB_USER }}
      DB_PASSWORD: ${{ secrets.SVENSK_DB_PASSWORD }}
      SSH_HOST: ${{ secrets.SVENSK_SSH_HOST }}
      SSH_LOCAL_DB_PORT: ${{ secrets.SVENSK_SSH_LOCAL_DB_PORT }}
      LEAGUE_ID: ${{ matrix.league_id }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install database clients
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client openssh-client
          python -m pip install --disable-pip-version-check --no-cache-dir pymysql==1.1.2

      - name: Open read-only SSH tunnel to SportsGamer
        env:
          SSH_HOST: ${{ secrets.SVENSK_SSH_HOST }}
          SSH_PORT: ${{ secrets.SVENSK_SSH_PORT }}
          SSH_USER: ${{ secrets.SVENSK_SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SVENSK_SSH_PRIVATE_KEY }}
          SSH_REMOTE_DB_HOST: ${{ secrets.SVENSK_SSH_REMOTE_DB_HOST }}
          SSH_REMOTE_DB_PORT: ${{ secrets.SVENSK_SSH_REMOTE_DB_PORT }}
          SSH_LOCAL_DB_PORT: ${{ secrets.SVENSK_SSH_LOCAL_DB_PORT }}
        run: |
          set -euo pipefail
          : "${SSH_HOST:?Missing SVENSK_SSH_HOST secret}"
          : "${SSH_USER:?Missing SVENSK_SSH_USER secret}"
          : "${SSH_PRIVATE_KEY:?Missing SVENSK_SSH_PRIVATE_KEY secret}"
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/svensk_db_tunnel_key
          chmod 600 ~/.ssh/svensk_db_tunnel_key
          ssh-keyscan -p "${SSH_PORT:-22}" "$SSH_HOST" >> ~/.ssh/known_hosts
          ssh -fN -i ~/.ssh/svensk_db_tunnel_key -p "${SSH_PORT:-22}" \
            -L "${SSH_LOCAL_DB_PORT:-3307}:${SSH_REMOTE_DB_HOST:-127.0.0.1}:${SSH_REMOTE_DB_PORT:-3306}" \
            "$SSH_USER@$SSH_HOST"

      - name: Read teams, roster and player IDs from SportsGamer
        id: export
        run: python .github/sync/export-broadcast-league-roster.py

      - name: Read standings from reported SportsGamer matches
        id: team_stats
        run: python .github/sync/export-broadcast-league-team-stats.py

      - name: Read full skater and goalie statistics
        id: player_stats
        env:
          PLAYER_IDS_FILE: /tmp/broadcast_player_ids.csv
          EXPORT_FILE: /tmp/swedish_player_stats.csv
          MIN_PLAYER_COUNT: '1'
          LEAGUE_IDS: ${{ matrix.league_id }}
          CURRENT_LEAGUE_WINDOW: '0'
        run: python .github/sync/export_current_swedish_player_stats.py

      - name: Import teams and roster into Supabase
        env:
          PGURL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          : "${PGURL:?Missing SUPABASE_DB_URL secret}"
          timeout --foreground --kill-after=30s 10m \
            psql "$PGURL" -v ON_ERROR_STOP=1 -f .github/sync/import-broadcast-league-roster.psql

      - name: Import standings into Supabase
        env:
          PGURL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          timeout --foreground --kill-after=30s 10m \
            psql "$PGURL" -v ON_ERROR_STOP=1 -f .github/sync/import-broadcast-league-team-stats.psql

      - name: Import player statistics into Supabase
        env:
          PGURL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          timeout --foreground --kill-after=30s 10m \
            psql "$PGURL" -v ON_ERROR_STOP=1 -f .github/sync/import-current-swedish-player-stats.psql

      - name: Verify Broadcast Studio rows
        env:
          PGURL: ${{ secrets.SUPABASE_DB_URL }}
          LEAGUE_ID: ${{ matrix.league_id }}
        run: |
          psql "$PGURL" -v ON_ERROR_STOP=1 -v league_id="$LEAGUE_ID" <<'SQL'
          select sports_gamer_league_id, statistics_stage, count(*) as teams,
                 sum(games_played) as team_games
          from public.v_broadcast_teams_public
          where sports_gamer_league_id=:'league_id'::bigint
          group by sports_gamer_league_id, statistics_stage
          order by statistics_stage;

          select sports_gamer_league_id, count(*) as players,
                 count(*) filter (
                   where coalesce(regular_skater_games,0)+coalesce(playoff_skater_games,0)
                        +coalesce(regular_goalie_games,0)+coalesce(playoff_goalie_games,0) > 0
                 ) as players_with_stats
          from public.v_broadcast_players_public
          where sports_gamer_league_id=:'league_id'::bigint
          group by sports_gamer_league_id;
          SQL

      - name: Summary
        if: always()
        run: |
          {
            echo "## Broadcast Studio data sync"
            echo ""
            echo "- SportsGamer league: **${{ matrix.league_id }}**"
            echo "- Teams: **${{ steps.export.outputs.team_count || 0 }}**"
            echo "- Current roster players: **${{ steps.export.outputs.player_count || 0 }}**"
            echo "- Players checked for statistics: **${{ steps.export.outputs.stats_player_count || 0 }}**"
            echo "- Reported matches: **${{ steps.team_stats.outputs.completed_match_count || 0 }}**"
            echo "- Team-stage rows: **${{ steps.team_stats.outputs.team_stat_row_count || 0 }}**"
            echo "- Source: direct SportsGamer read-only database"
            echo "- Result: **${{ job.status }}**"
          } >> "$GITHUB_STEP_SUMMARY"
