name: Player profile foreign fallback once

on:
  push:
    paths:
      - '.github/workflows/player-profile-foreign-fallback-once.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch player profile fallback
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          old = base64.b64decode('').decode('utf-8')
          new = base64.b64decode('').decode('utf-8')
          path = Path('app.js')
          text = path.read_text(encoding='utf-8')
          if old not in text:
            raise SystemExit('Expected player routing block not found; refusing to patch')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          index = Path('index.html')
          html = index.read_text(encoding='utf-8')
          html = html.replace('app.js?v=20260907-v12994-admin-live','app.js?v=20260908-v12995-foreign-player-profile')
          index.write_text(html, encoding='utf-8')
          PY
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html
          git commit -m "Allow ECL foreign roster players to open profiles"
          git push
