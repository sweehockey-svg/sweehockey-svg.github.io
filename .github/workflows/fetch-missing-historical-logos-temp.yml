name: Temporary Missing Historical Logos

on:
  push:
    paths:
      - '.github/workflows/fetch-missing-historical-logos-temp.yml'

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download verified historical logos
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/teamlogos
          python3 - <<'PY'
          import urllib.request, urllib.parse, json
          from pathlib import Path

          opener = urllib.request.build_opener()
          opener.addheaders=[('User-Agent','Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36')]

          exact = {
            'NHL 19 Allstars.png': 'https://sportsgamer.gg/storage/team-logos/287/3760/NHL 19 Allstars_20230419-121953.png',
            'Delusion.png': 'https://fhr.fra1.cdn.digitaloceanspaces.com/NHLGamer/IS_Cup_4/Logos/Delusion.png',
            'Symphony.png': 'https://fhr.fra1.cdn.digitaloceanspaces.com/NHLGamer/ECL/ECL7/logos/Elite/Symphony.png',
            'SJK eSports.png': 'https://fhr.fra1.cdn.digitaloceanspaces.com/NHLGamer/ECL/ECL6/Logos/Elite/SJK eSports.png',
            'Aapon Taikasauva.png': 'https://fhr.fra1.cdn.digitaloceanspaces.com/NHLGamer/ECL/ECL-5-Logos_500px/Elite/Aapon Taikasauva.png',
            'hREDS.png': 'https://fhr.fra1.cdn.digitaloceanspaces.com/NHLGamer/ECL/ECL10/Logos/Elite/hREDS_logo_png.png',
            'Herforder Ice Dragons.png': 'https://sportsgamer.gg/storage/team-logos/241/3249/HEV Logo Sportsgamer_20221115-143043.png',
            'Puck Panthers.png': 'https://fhr.fra1.cdn.digitaloceanspaces.com/NHLGamer/SL/Logos/S1/Puck Panthers 500x500.png',
            'Refuse To Lose.jpg': 'https://fhr.fra1.cdn.digitaloceanspaces.com/NHLGamer/ECL/refuse.jpg',
            'Everyday Im Byfuglien.jpg': 'https://fhr.fra1.cdn.digitaloceanspaces.com/NHLGamer/ECL/Summer_Cup/byfuglien.jpg',
          }

          probes = {
            'Taidottomat Lupaukset': [
              'https://fhr.fra1.cdn.digitaloceanspaces.com/NHLGamer/ECL/ECL6/Logos/Lite/Taidottomat Lupaukset.png',
              'https://fhr.fra1.cdn.digitaloceanspaces.com/NHLGamer/ECL/ECL6/logos/Lite/Taidottomat Lupaukset.png',
              'https://fhr.fra1.cdn.digitaloceanspaces.com/NHLGamer/ECL/ECL6/Logos/Lite/Taidottomat_Lupaukset.png',
            ],
            'Sweden Wikings': [
              'https://fhr.fra1.cdn.digitaloceanspaces.com/NHLGamer/SL/Logos/S1/Sweden Wikings 500x500.png',
              'https://fhr.fra1.cdn.digitaloceanspaces.com/NHLGamer/SL/Logos/S1/Sweden Wikings.png',
              'https://fhr.fra1.cdn.digitaloceanspaces.com/NHLGamer/SL/Logos/S1/SwedenWikings.png',
            ],
            'NG Friday Night Lights': [
              'https://fhr.fra1.cdn.digitaloceanspaces.com/NHLGamer/ECL/Summer_Cup_3/NG Friday Night Lights.png',
              'https://fhr.fra1.cdn.digitaloceanspaces.com/NHLGamer/ECL/Summer_Cup3/NG Friday Night Lights.png',
              'https://fhr.fra1.cdn.digitaloceanspaces.com/NHLGamer/Summer_Cup_3/NG Friday Night Lights.png',
            ],
            'NG Spring': [
              'https://fhr.fra1.cdn.digitaloceanspaces.com/NHLGamer/ECL/Summer_Cup_3/NG Spring.png',
              'https://fhr.fra1.cdn.digitaloceanspaces.com/NHLGamer/ECL/Summer_Cup3/NG Spring.png',
              'https://fhr.fra1.cdn.digitaloceanspaces.com/NHLGamer/Summer_Cup_3/NG Spring.png',
            ],
          }

          def encoded(url):
            p=urllib.parse.urlsplit(url)
            path=urllib.parse.quote(urllib.parse.unquote(p.path), safe='/:%')
            return urllib.parse.urlunsplit((p.scheme,p.netloc,path,p.query,p.fragment))

          def fetch(url):
            with opener.open(encoded(url), timeout=30) as r:
              data=r.read(); ct=r.headers.get('Content-Type','')
            sig=data[:16]
            ok=sig.startswith(b'\x89PNG') or sig[:3]==b'\xff\xd8\xff' or sig.startswith(b'GIF8') or b'<svg' in data[:300].lower()
            if not ok or len(data)<1000:
              raise RuntimeError(f'not useful image: {len(data)} bytes {ct}')
            return data,ct

          report={'exact':{},'probes':{}}
          for fn,url in exact.items():
            try:
              data,ct=fetch(url)
              Path('out/teamlogos',fn).write_bytes(data)
              report['exact'][fn]={'ok':True,'url':url,'bytes':len(data),'content_type':ct}
            except Exception as e:
              report['exact'][fn]={'ok':False,'url':url,'error':repr(e)}

          for name,urls in probes.items():
            report['probes'][name]=[]
            for url in urls:
              try:
                data,ct=fetch(url)
                ext='.jpg' if data[:3]==b'\xff\xd8\xff' else '.png'
                fn=name+ext
                Path('out/teamlogos',fn).write_bytes(data)
                report['probes'][name].append({'ok':True,'url':url,'file':fn,'bytes':len(data),'content_type':ct})
                break
              except Exception as e:
                report['probes'][name].append({'ok':False,'url':url,'error':repr(e)})

          Path('out/report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
          print(Path('out/report.json').read_text())
          PY
          find out -maxdepth 2 -type f -printf '%p %s bytes\n'
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: missing-historical-logos-exact
          path: out/
          if-no-files-found: error
          retention-days: 1
