name: Sync all SCL 27 data
run-name: SCL 27 unified data · ${{ inputs.request_id || 'manual' }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Request id from the Svensk eHockey admin page
        required: false
        default: manual
        type: string

permissions:
  contents: read

# Preserve the deployed admin dispatch/status endpoint. The common import owns
# the SCL concurrency lock; do not duplicate it in this caller.
jobs:
  sync:
    uses: ./.github/workflows/sync-fantasy-sportsgamer.yml
    with:
      request_id: ${{ inputs.request_id }}
      competition_code: SCL2027
      league_ids: '527'
      trigger_type: manual
    secrets: inherit
