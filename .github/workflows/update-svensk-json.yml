name: Update Svensk eHockey JSON

on:
  workflow_dispatch:
    inputs:
      file:
        description: JSON file to update, or all
        required: true
        default: all
        type: string

permissions:
  contents: write

concurrency:
  group: update-svensk-json
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install MySQL client, jq and SSH
        run: |
          sudo apt-get update
          sudo apt-get install -y mysql-client jq openssh-client

      - name: Open SSH tunnel
        env:
          SSH_HOST: ${{ secrets.SVENSK_SSH_HOST }}
          SSH_PORT: ${{ secrets.SVENSK_SSH_PORT }}
          SSH_USER: ${{ secrets.SVENSK_SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SVENSK_SSH_PRIVATE_KEY }}
          SSH_REMOTE_DB_HOST: ${{ secrets.SVENSK_SSH_REMOTE_DB_HOST }}
          SSH_REMOTE_DB_PORT: ${{ secrets.SVENSK_SSH_REMOTE_DB_PORT }}
          SSH_LOCAL_DB_PORT: ${{ secrets.SVENSK_SSH_LOCAL_DB_PORT }}
        run: |
          set -euo pipefail

          if [ -z "${SSH_HOST:-}" ]; then
            echo "No SVENSK_SSH_HOST secret set, skipping SSH tunnel."
            exit 0
          fi

          : "${SSH_USER:?Missing SVENSK_SSH_USER secret}"
          : "${SSH_PRIVATE_KEY:?Missing SVENSK_SSH_PRIVATE_KEY secret}"

          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/svensk_db_tunnel_key
          chmod 600 ~/.ssh/svensk_db_tunnel_key

          ssh-keyscan -p "${SSH_PORT:-22}" "$SSH_HOST" >> ~/.ssh/known_hosts

          ssh \
            -fN \
            -i ~/.ssh/svensk_db_tunnel_key \
            -p "${SSH_PORT:-22}" \
            -L "${SSH_LOCAL_DB_PORT:-3307}:${SSH_REMOTE_DB_HOST:-127.0.0.1}:${SSH_REMOTE_DB_PORT:-3306}" \
            "$SSH_USER@$SSH_HOST"

      - name: Export selected JSON
        env:
          REQUESTED_FILE: ${{ inputs.file }}
          DB_HOST: ${{ secrets.SVENSK_DB_HOST }}
          DB_PORT: ${{ secrets.SVENSK_DB_PORT }}
          DB_NAME: ${{ secrets.SVENSK_DB_NAME }}
          DB_USER: ${{ secrets.SVENSK_DB_USER }}
          DB_PASSWORD: ${{ secrets.SVENSK_DB_PASSWORD }}
          SSH_HOST: ${{ secrets.SVENSK_SSH_HOST }}
          SSH_LOCAL_DB_PORT: ${{ secrets.SVENSK_SSH_LOCAL_DB_PORT }}
        run: |
          set -euo pipefail

          if [ "$REQUESTED_FILE" != "svenska-spelare-index.json" ]; then
            : "${DB_NAME:?Missing SVENSK_DB_NAME secret}"
            : "${DB_USER:?Missing SVENSK_DB_USER secret}"
            : "${DB_PASSWORD:?Missing SVENSK_DB_PASSWORD secret}"

            if [ -n "${SSH_HOST:-}" ]; then
              DB_HOST="${DB_HOST:-127.0.0.1}"
              DB_PORT="${DB_PORT:-${SSH_LOCAL_DB_PORT:-3307}}"
            else
              : "${DB_HOST:?Missing SVENSK_DB_HOST secret}"
              DB_PORT="${DB_PORT:-3306}"
            fi
          fi

          export_one() {
            local target="$1"
            local sql_file="$2"

            echo "Exporting $target from $sql_file"
            mysql \
              --host="$DB_HOST" \
              --port="$DB_PORT" \
              --user="$DB_USER" \
              --password="$DB_PASSWORD" \
              --default-character-set=utf8mb4 \
              --batch \
              --raw \
              --skip-column-names \
              "$DB_NAME" \
              < "$sql_file" \
              > "$target.tmp"

            jq . "$target.tmp" > "$target"
            rm "$target.tmp"
          }

          update_file() {
            case "$1" in
              svenskstatistikecl26spring.json)
                export_one "$1" "sql/svenskstatistikecl26springjson-o-byten-v12-playoffstage.sql"
                ;;
              svenska-lag-historia.json)
                export_one "$1" "sql/svenska-lag-historia.sql"
                ;;
              svenska-lag-historia-teams.json)
                export_one "$1" "sql/svenska-lag-historia-teams.sql"
                node tools/build-svenska-spelare-index.cjs
                if [ "$REQUESTED_FILE" != "all" ]; then
                  node tools/import-ithl.cjs
                fi
                ;;
              svenska-lag-historia-player-history.json)
                export_one "$1" "sql/svenska-lag-historia-player-history.sql"
                ;;
              svenska-lag-historia-player-completions.json)
                export_one "$1" "sql/svenska-lag-historia-player-completions.sql"
                ;;
              svenska-lag-historia-podiums.json)
                export_one "$1" "sql/svenska-lag-historia-podiums.sql"
                ;;
              svenska-spelare-index.json)
                node tools/build-svenska-spelare-index.cjs
                node tools/import-ithl.cjs
                ;;
              *)
                echo "No automatic SQL export configured for $1" >&2
                exit 1
                ;;
            esac
          }

          if [ "$REQUESTED_FILE" = "all" ]; then
            update_file "svenskstatistikecl26spring.json"
            update_file "svenska-lag-historia.json"
            update_file "svenska-lag-historia-teams.json"
            update_file "svenska-lag-historia-player-history.json"
            update_file "svenska-lag-historia-player-completions.json"
            update_file "svenska-lag-historia-podiums.json"
            update_file "svenska-spelare-index.json"
          else
            update_file "$REQUESTED_FILE"
          fi

      - name: Commit updated JSON
        run: |
          set -euo pipefail

          if git diff --quiet -- *.json; then
            echo "JSON files are already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add *.json
          git commit -m "Update Svensk eHockey JSON"
          git push
