<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Svensk eHockey – svensk eHockey samlad på ett ställe.">
  <title>Svensk eHockey – Hem</title>
  <link rel="icon" type="image/png" href="assets/SeHlogga.png">
  <link rel="stylesheet" href="styles.css?v=20260814-v90-team-best-ecl-second-row">
<style>
    .portal-button--primary,
    .portal-button--primary:hover,
    .portal-button--primary:focus-visible {
      color: #050505 !important;
    }

    /* Gör vattenloggan större och renare */
    .portal-mark {
      flex: 0 0 min(48vw, 680px);
      width: min(48vw, 680px);
      max-width: 100%;
      position: relative;
    }

    .portal-mark img {
      display: block;
      width: 100%;
      max-width: 100%;
      height: auto;
      opacity: 0.95;
    }

    /* Ta bort texten över/vid loggan */
    .portal-mark span {
      display: none !important;
    }

    /* Ta bort cirkeln/dekor runt loggan */
    .portal-mark::before,
    .portal-mark::after {
      display: none !important;
      content: none !important;
    }

    @media (max-width: 1100px) {
      .portal-mark {
        flex-basis: min(50vw, 560px);
        width: min(50vw, 560px);
      }
    }

    @media (max-width: 900px) {
      .portal-mark {
        flex-basis: min(72vw, 480px);
        width: min(72vw, 480px);
        margin: 0 auto;
      }
    }
  </style>
</head>
<body class="directory-page portal-page">
  <noscript>
    <main class="directory-shell">
      <section class="notice notice-warning">
        <h1>JavaScript krävs</h1>
        <p>Svensk eHockey behöver JavaScript för att visa datavyerna.</p>
      </section>
    </main>
  </noscript>

</body>
</html>
