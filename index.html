      try {
        savedConsent = localStorage.getItem("seh_analytics_consent");
      } catch (error) {

      window.SEH_ANALYTICS_CHOICE = savedConsent;

        analytics_storage: analyticsGranted ? "granted" : "denied",
        ad_storage: "denied",
        ad_user_data: "denied",
        ad_personalization: "denied"
      });

      gtag("js", new Date());
      gtag("config", window.SEH_GA_ID, {
        send_page_view: false
      });
    })();
