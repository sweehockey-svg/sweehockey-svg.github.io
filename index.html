    .home-stage__cta-row {
      position:relative;
      z-index:3;
      display:flex;
      align-items:center;
      flex-wrap:wrap;
      gap:10px 18px;
      margin-top:clamp(11px,1.45vh,16px);
    }
    .home-android-cta {
      position:relative;
      isolation:isolate;
      box-sizing:border-box;
      width:min(100%,336px);
      min-height:54px;
      display:grid;
      grid-template-columns:38px minmax(0,1fr) 30px;
      align-items:center;
      gap:11px;
      padding:7px 10px 7px 8px;
      overflow:hidden;
      border:1px solid rgba(214,177,95,.58);
      border-radius:14px;
      color:#f7f4ea;
      text-decoration:none;
      background:
        radial-gradient(circle at 12% 50%,rgba(255,204,0,.12),transparent 28%),
        linear-gradient(112deg,rgba(11,23,38,.98),rgba(5,10,18,.98) 58%,rgba(2,5,10,.99));
      box-shadow:
        0 0 0 1px rgba(255,255,255,.025) inset,
        0 10px 26px rgba(0,0,0,.24),
        0 0 22px rgba(214,177,95,.055);
      transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease,background .18s ease;
    }
    .home-android-cta::before {
      position:absolute;
      top:0;
      right:0;
      left:0;
      height:2px;
      content:"";
      opacity:.82;
      background:linear-gradient(90deg,rgba(67,232,225,.72),rgba(214,177,95,.92) 58%,rgba(255,204,0,.18));
    }
    .home-android-cta::after {
      position:absolute;
      top:-34px;
      right:-28px;
      z-index:-1;
      width:112px;
      height:112px;
      border-radius:50%;
      content:"";
      opacity:.5;
      background:radial-gradient(circle,rgba(255,204,0,.12),transparent 68%);
      pointer-events:none;
    }
    .home-android-cta__icon {
      position:relative;
      width:38px;
      height:38px;
      display:grid;
      place-items:center;
      border:1px solid rgba(255,204,0,.42);
      border-radius:11px;
      color:#ffcc00;
      background:linear-gradient(145deg,rgba(255,204,0,.14),rgba(255,204,0,.035));
      box-shadow:0 0 16px rgba(255,204,0,.06) inset;
      font-size:20px;
      font-weight:800;
      line-height:1;
    }
    .home-android-cta__icon::after {
      position:absolute;
      bottom:8px;
      width:11px;
      height:2px;
      border-radius:2px;
      content:"";
      background:currentColor;
      opacity:.9;
    }
    .home-android-cta__copy {
      min-width:0;
      display:grid;
      gap:2px;
    }
    .home-android-cta__copy small,
    .home-android-cta__copy strong {
      display:block;
    }
    .home-android-cta__copy small {
      color:rgba(67,232,225,.82);
      font-size:8.5px;
      font-weight:900;
      letter-spacing:.12em;
      line-height:1.1;
    }
    .home-android-cta__copy strong {
      overflow:hidden;
      color:#f5f2e9;
      font-size:14.5px;
      font-weight:900;
      letter-spacing:-.015em;
      line-height:1.15;
      text-overflow:ellipsis;
      white-space:nowrap;
    }
    .home-android-cta__arrow {
      width:28px;
      height:28px;
      display:grid;
      place-items:center;
      justify-self:end;
      border:1px solid rgba(214,177,95,.32);
      border-radius:50%;
      color:#f0d58b;
      background:rgba(214,177,95,.045);
      font-size:16px;
      line-height:1;
      transition:transform .18s ease,border-color .18s ease,background .18s ease;
    }
    .home-android-cta:hover,
    .home-android-cta:focus-visible {
      outline:none;
      transform:translateY(-2px);
      border-color:rgba(255,204,0,.88);
      background:
        radial-gradient(circle at 12% 50%,rgba(255,204,0,.17),transparent 30%),
        linear-gradient(112deg,rgba(13,28,45,.99),rgba(6,12,21,.99) 60%,rgba(3,7,12,.99));
      box-shadow:
        0 0 0 1px rgba(255,204,0,.08) inset,
        0 13px 30px rgba(0,0,0,.3),
        0 0 28px rgba(255,204,0,.09);
    }
    .home-android-cta:hover .home-android-cta__arrow,
    .home-android-cta:focus-visible .home-android-cta__arrow {
      transform:translateX(2px);
      border-color:rgba(255,204,0,.56);
