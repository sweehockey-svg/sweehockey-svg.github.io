<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Svensk eHockey</title>
  <meta name="description" content="Svensk eHockey – matcher, statistik, spelare, lag och svensk eHockey-historia.">
  <meta name="theme-color" content="#090909">
  <link rel="icon" type="image/png" href="./assets/SeHlogga.png">
  <link rel="apple-touch-icon" href="./assets/SeHlogga.png">
  <link rel="stylesheet" href="./styles.css?v=player-id-jpg-direct-20260713a">
  <link rel="stylesheet" href="./v5-blank.css?v=20260718v5af">
</head>
<body>
  <div id="app">
    <div class="boot">Laddar Svensk eHockey...</div>
  </div>
  <script>
    if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("./sw.js?v=v5-blank-20260718ai", { updateViaCache: "none" }).catch(function () {});
    }
  </script>
  <script>
    (function () {
      var attempt = 0;
      var maxAttempts = 3;

      function showFailure() {
        var app = document.getElementById("app");
        if (!app) return;
        app.innerHTML = '<div class="boot">Sidan kunde inte starta. <button type="button" id="retry-app">Försök igen</button></div>';
        var button = document.getElementById("retry-app");
        if (button) button.onclick = function () { attempt = 0; loadApp(); };
      }

      function loadApp() {
        if (window.__SVENSK_EHOCKEY_APP_READY__) return;
        var currentAttempt = attempt++;
        var script = document.createElement("script");
        var finished = false;
        var timer;

        function retry() {
          if (finished || window.__SVENSK_EHOCKEY_APP_READY__) return;
          finished = true;
          clearTimeout(timer);
          script.onload = null;
          script.onerror = null;
          script.remove();
          if (attempt < maxAttempts) setTimeout(loadApp, 350 * attempt);
          else showFailure();
        }

        script.src = "./app.js?v=v5-blank-20260718ai&attempt=" + currentAttempt;
        script.async = true;
        script.onload = function () {
          clearTimeout(timer);
          if (!window.__SVENSK_EHOCKEY_APP_READY__) retry();
        };
        script.onerror = retry;
        timer = setTimeout(retry, 12000);
        document.body.appendChild(script);
      }

      loadApp();
    })();
  </script>
</body>
</html>
